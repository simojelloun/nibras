['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَأَسِرُّواْ قَوۡلَكُمۡ أَوِ ٱجۡهَرُواْ بِهِۦٓۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ ٱلصُّدُورِ﴾ في سورة الملك؟',['﴿أَلَا يَعۡلَمُ مَنۡ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلۡخَبِيرُ﴾','﴿ءَأَمِنتُم مَّن فِي ٱلسَّمَآءِ أَن يَخۡسِفَ بِكُمُ ٱلۡأَرۡضَ فَإِذَا هِيَ تَمُورُ﴾','﴿إِنَّ ٱلَّذِينَ يَخۡشَوۡنَ رَبَّهُم بِٱلۡغَيۡبِ لَهُم مَّغۡفِرَةٞ وَأَجۡرٞ كَبِيرٞ﴾','﴿قُلۡ هُوَ ٱلَّذِي ذَرَأَكُمۡ فِي ٱلۡأَرۡضِ وَإِلَيۡهِ تُحۡشَرُونَ﴾'],'سورة الملك، الآية 14'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلۡوَعۡدُ إِن كُنتُمۡ صَٰدِقِينَ﴾ في سورة الملك؟',['﴿قُلۡ إِنَّمَا ٱلۡعِلۡمُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٞ مُّبِينٞ﴾','﴿وَقَالُواْ لَوۡ كُنَّا نَسۡمَعُ أَوۡ نَعۡقِلُ مَا كُنَّا فِيٓ أَصۡحَٰبِ ٱلسَّعِيرِ﴾','﴿ثُمَّ ٱرۡجِعِ ٱلۡبَصَرَ كَرَّتَيۡنِ يَنقَلِبۡ إِلَيۡكَ ٱلۡبَصَرُ خَاسِئٗا وَهُوَ حَسِيرٞ﴾','﴿إِنَّ ٱلَّذِينَ يَخۡشَوۡنَ رَبَّهُم بِٱلۡغَيۡبِ لَهُم مَّغۡفِرَةٞ وَأَجۡرٞ كَبِيرٞ﴾'],'سورة الملك، الآية 26'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿إِنَّ ٱلَّذِينَ يَخۡشَوۡنَ رَبَّهُم بِٱلۡغَيۡبِ لَهُم مَّغۡفِرَةٞ وَأَجۡرٞ كَبِيرٞ﴾ في سورة الملك؟',['﴿وَأَسِرُّواْ قَوۡلَكُمۡ أَوِ ٱجۡهَرُواْ بِهِۦٓۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ ٱلصُّدُورِ﴾','﴿وَلِلَّذِينَ كَفَرُواْ بِرَبِّهِمۡ عَذَابُ جَهَنَّمَۖ وَبِئۡسَ ٱلۡمَصِيرُ﴾','﴿قُلۡ أَرَءَيۡتُمۡ إِنۡ أَصۡبَحَ مَآؤُكُمۡ غَوۡرٗا فَمَن يَأۡتِيكُم بِمَآءٖ مَّعِينِۭ﴾','﴿أَلَا يَعۡلَمُ مَنۡ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلۡخَبِيرُ﴾'],'سورة الملك، الآية 13'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿قَالُواْ سُبۡحَٰنَ رَبِّنَآ إِنَّا كُنَّا ظَٰلِمِينَ﴾ في سورة القلم؟',['﴿فَأَقۡبَلَ بَعۡضُهُمۡ عَلَىٰ بَعۡضٖ يَتَلَٰوَمُونَ﴾','﴿إِنَّ لِلۡمُتَّقِينَ عِندَ رَبِّهِمۡ جَنَّـٰتِ ٱلنَّعِيمِ﴾','﴿فَٱجۡتَبَٰهُ رَبُّهُۥ فَجَعَلَهُۥ مِنَ ٱلصَّـٰلِحِينَ﴾','﴿نٓۚ وَٱلۡقَلَمِ وَمَا يَسۡطُرُونَ﴾'],'سورة القلم، الآية 30'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿فَٱصۡبِرۡ لِحُكۡمِ رَبِّكَ وَلَا تَكُن كَصَاحِبِ ٱلۡحُوتِ إِذۡ نَادَىٰ وَهُوَ مَكۡظُومٞ﴾ في سورة القلم؟',['﴿لَّوۡلَآ أَن تَدَٰرَكَهُۥ نِعۡمَةٞ مِّن رَّبِّهِۦ لَنُبِذَ بِٱلۡعَرَآءِ وَهُوَ مَذۡمُومٞ﴾','﴿إِنَّ لَكُمۡ فِيهِ لَمَا تَخَيَّرُونَ﴾','﴿عَسَىٰ رَبُّنَآ أَن يُبۡدِلَنَا خَيۡرٗا مِّنۡهَآ إِنَّآ إِلَىٰ رَبِّنَا رَٰغِبُونَ﴾','﴿وَإِنَّ لَكَ لَأَجۡرًا غَيۡرَ مَمۡنُونٖ﴾'],'سورة القلم، الآية 49'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿أَن لَّا يَدۡخُلَنَّهَا ٱلۡيَوۡمَ عَلَيۡكُم مِّسۡكِينٞ﴾ في سورة القلم؟',['﴿وَغَدَوۡاْ عَلَىٰ حَرۡدٖ قَٰدِرِينَ﴾','﴿أَنِ ٱغۡدُواْ عَلَىٰ حَرۡثِكُمۡ إِن كُنتُمۡ صَٰرِمِينَ﴾','﴿أَمۡ لَكُمۡ كِتَٰبٞ فِيهِ تَدۡرُسُونَ﴾','﴿فَأَصۡبَحَتۡ كَٱلصَّرِيمِ﴾'],'سورة القلم، الآية 25'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿قُطُوفُهَا دَانِيَةٞ﴾ في سورة الحاقة؟',['﴿كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَآ أَسۡلَفۡتُمۡ فِي ٱلۡأَيَّامِ ٱلۡخَالِيَةِ﴾','﴿وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلۡمِسۡكِينِ﴾','﴿ثُمَّ فِي سِلۡسِلَةٖ ذَرۡعُهَا سَبۡعُونَ ذِرَاعٗا فَٱسۡلُكُوهُ﴾','﴿مَآ أَغۡنَىٰ عَنِّي مَالِيَهۡۜ﴾'],'سورة الحاقة، الآية 24'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَمَآ أَدۡرَىٰكَ مَا ٱلۡحَآقَّةُ﴾ في سورة الحاقة؟',['﴿كَذَّبَتۡ ثَمُودُ وَعَادُۢ بِٱلۡقَارِعَةِ﴾','﴿وَلَمۡ أَدۡرِ مَا حِسَابِيَهۡ﴾','﴿وَلَا طَعَامٌ إِلَّا مِنۡ غِسۡلِينٖ﴾','﴿مَآ أَغۡنَىٰ عَنِّي مَالِيَهۡۜ﴾'],'سورة الحاقة، الآية 4'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿كَذَّبَتۡ ثَمُودُ وَعَادُۢ بِٱلۡقَارِعَةِ﴾ في سورة الحاقة؟',['﴿فَأَمَّا ثَمُودُ فَأُهۡلِكُواْ بِٱلطَّاغِيَةِ﴾','﴿فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ﴾','﴿يَٰلَيۡتَهَا كَانَتِ ٱلۡقَاضِيَةَ﴾','﴿فَلَآ أُقۡسِمُ بِمَا تُبۡصِرُونَ﴾'],'سورة الحاقة، الآية 5'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَلَا يَسۡـَٔلُ حَمِيمٌ حَمِيمٗا﴾ في سورة المعارج؟',['﴿يُبَصَّرُونَهُمۡۚ يَوَدُّ ٱلۡمُجۡرِمُ لَوۡ يَفۡتَدِي مِنۡ عَذَابِ يَوۡمِئِذِۭ بِبَنِيهِ﴾','﴿وَٱلَّذِينَ هُم مِّنۡ عَذَابِ رَبِّهِم مُّشۡفِقُونَ﴾','﴿كَلَّآۖ إِنَّا خَلَقۡنَٰهُم مِّمَّا يَعۡلَمُونَ﴾','﴿وَٱلَّذِينَ يُصَدِّقُونَ بِيَوۡمِ ٱلدِّينِ﴾'],'سورة المعارج، الآية 11'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿فَمَالِ ٱلَّذِينَ كَفَرُواْ قِبَلَكَ مُهۡطِعِينَ﴾ في سورة المعارج؟',['﴿عَنِ ٱلۡيَمِينِ وَعَنِ ٱلشِّمَالِ عِزِينَ﴾','﴿فَمَنِ ٱبۡتَغَىٰ وَرَآءَ ذَٰلِكَ فَأُوْلَـٰٓئِكَ هُمُ ٱلۡعَادُونَ﴾','﴿كَلَّآۖ إِنَّا خَلَقۡنَٰهُم مِّمَّا يَعۡلَمُونَ﴾','﴿وَفَصِيلَتِهِ ٱلَّتِي تُـٔۡوِيهِ﴾'],'سورة المعارج، الآية 37'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَجَمَعَ فَأَوۡعَىٰٓ﴾ في سورة المعارج؟',['﴿۞إِنَّ ٱلۡإِنسَٰنَ خُلِقَ هَلُوعًا﴾','﴿لِّلسَّآئِلِ وَٱلۡمَحۡرُومِ﴾','﴿أُوْلَـٰٓئِكَ فِي جَنَّـٰتٖ مُّكۡرَمُونَ﴾','﴿سَأَلَ سَآئِلُۢ بِعَذَابٖ وَاقِعٖ﴾'],'سورة المعارج، الآية 19'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلۡأَرۡضِ نَبَاتٗا﴾ في سورة نوح؟',['﴿ثُمَّ يُعِيدُكُمۡ فِيهَا وَيُخۡرِجُكُمۡ إِخۡرَاجٗا﴾','﴿قَالَ يَٰقَوۡمِ إِنِّي لَكُمۡ نَذِيرٞ مُّبِينٌ﴾','﴿أَنِ ٱعۡبُدُواْ ٱللَّهَ وَٱتَّقُوهُ وَأَطِيعُونِ﴾','﴿وَقَدۡ أَضَلُّواْ كَثِيرٗاۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا ضَلَٰلٗا﴾'],'سورة نوح، الآية 18'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿قَالَ رَبِّ إِنِّي دَعَوۡتُ قَوۡمِي لَيۡلٗا وَنَهَارٗا﴾ في سورة نوح؟',['﴿فَلَمۡ يَزِدۡهُمۡ دُعَآءِيٓ إِلَّا فِرَارٗا﴾','﴿وَقَدۡ أَضَلُّواْ كَثِيرٗاۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا ضَلَٰلٗا﴾','﴿وَٱللَّهُ جَعَلَ لَكُمُ ٱلۡأَرۡضَ بِسَاطٗا﴾','﴿ثُمَّ إِنِّي دَعَوۡتُهُمۡ جِهَارٗا﴾'],'سورة نوح، الآية 6'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَٱللَّهُ جَعَلَ لَكُمُ ٱلۡأَرۡضَ بِسَاطٗا﴾ في سورة نوح؟',['﴿لِّتَسۡلُكُواْ مِنۡهَا سُبُلٗا فِجَاجٗا﴾','﴿قَالَ يَٰقَوۡمِ إِنِّي لَكُمۡ نَذِيرٞ مُّبِينٌ﴾','﴿مَّا لَكُمۡ لَا تَرۡجُونَ لِلَّهِ وَقَارٗا﴾','﴿إِنَّكَ إِن تَذَرۡهُمۡ يُضِلُّواْ عِبَادَكَ وَلَا يَلِدُوٓاْ إِلَّا فَاجِرٗا كَفَّارٗا﴾'],'سورة نوح، الآية 20'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿حَتَّىٰٓ إِذَا رَأَوۡاْ مَا يُوعَدُونَ فَسَيَعۡلَمُونَ مَنۡ أَضۡعَفُ نَاصِرٗا وَأَقَلُّ عَدَدٗا﴾ في سورة الجن؟',['﴿قُلۡ إِنۡ أَدۡرِيٓ أَقَرِيبٞ مَّا تُوعَدُونَ أَمۡ يَجۡعَلُ لَهُۥ رَبِّيٓ أَمَدًا﴾','﴿قُلۡ إِنَّمَآ أَدۡعُواْ رَبِّي وَلَآ أُشۡرِكُ بِهِۦٓ أَحَدٗا﴾','﴿وَأَنَّا مِنَّا ٱلصَّـٰلِحُونَ وَمِنَّا دُونَ ذَٰلِكَۖ كُنَّا طَرَآئِقَ قِدَدٗا﴾','﴿وَأَنَّا لَا نَدۡرِيٓ أَشَرٌّ أُرِيدَ بِمَن فِي ٱلۡأَرۡضِ أَمۡ أَرَادَ بِهِمۡ رَبُّهُمۡ رَشَدٗا﴾'],'سورة الجن، الآية 25'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿قُلۡ إِنِّي لَآ أَمۡلِكُ لَكُمۡ ضَرّٗا وَلَا رَشَدٗا﴾ في سورة الجن؟',['﴿قُلۡ إِنِّي لَن يُجِيرَنِي مِنَ ٱللَّهِ أَحَدٞ وَلَنۡ أَجِدَ مِن دُونِهِۦ مُلۡتَحَدًا﴾','﴿وَأَنَّا لَا نَدۡرِيٓ أَشَرٌّ أُرِيدَ بِمَن فِي ٱلۡأَرۡضِ أَمۡ أَرَادَ بِهِمۡ رَبُّهُمۡ رَشَدٗا﴾','﴿وَأَنَّهُۥ لَمَّا قَامَ عَبۡدُ ٱللَّهِ يَدۡعُوهُ كَادُواْ يَكُونُونَ عَلَيۡهِ لِبَدٗا﴾','﴿عَٰلِمُ ٱلۡغَيۡبِ فَلَا يُظۡهِرُ عَلَىٰ غَيۡبِهِۦٓ أَحَدًا﴾'],'سورة الجن، الآية 22'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَأَنَّهُۥ كَانَ يَقُولُ سَفِيهُنَا عَلَى ٱللَّهِ شَطَطٗا﴾ في سورة الجن؟',['﴿وَأَنَّا ظَنَنَّآ أَن لَّن تَقُولَ ٱلۡإِنسُ وَٱلۡجِنُّ عَلَى ٱللَّهِ كَذِبٗا﴾','﴿قُلۡ إِنِّي لَن يُجِيرَنِي مِنَ ٱللَّهِ أَحَدٞ وَلَنۡ أَجِدَ مِن دُونِهِۦ مُلۡتَحَدًا﴾','﴿قُلۡ إِنۡ أَدۡرِيٓ أَقَرِيبٞ مَّا تُوعَدُونَ أَمۡ يَجۡعَلُ لَهُۥ رَبِّيٓ أَمَدًا﴾','﴿حَتَّىٰٓ إِذَا رَأَوۡاْ مَا يُوعَدُونَ فَسَيَعۡلَمُونَ مَنۡ أَضۡعَفُ نَاصِرٗا وَأَقَلُّ عَدَدٗا﴾'],'سورة الجن، الآية 5'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿أَوۡ زِدۡ عَلَيۡهِ وَرَتِّلِ ٱلۡقُرۡءَانَ تَرۡتِيلًا﴾ في سورة المزمل؟',['﴿إِنَّا سَنُلۡقِي عَلَيۡكَ قَوۡلٗا ثَقِيلًا﴾','﴿قُمِ ٱلَّيۡلَ إِلَّا قَلِيلٗا﴾','﴿ٱلسَّمَآءُ مُنفَطِرُۢ بِهِۦۚ كَانَ وَعۡدُهُۥ مَفۡعُولًا﴾','﴿يَـٰٓأَيُّهَا ٱلۡمُزَّمِّلُ﴾'],'سورة المزمل، الآية 5'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿قُمِ ٱلَّيۡلَ إِلَّا قَلِيلٗا﴾ في سورة المزمل؟',['﴿نِّصۡفَهُۥٓ أَوِ ٱنقُصۡ مِنۡهُ قَلِيلًا﴾','﴿وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا﴾','﴿فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ يَوۡمٗا يَجۡعَلُ ٱلۡوِلۡدَٰنَ شِيبًا﴾','﴿إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلًا﴾'],'سورة المزمل، الآية 3'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿إِنَّا سَنُلۡقِي عَلَيۡكَ قَوۡلٗا ثَقِيلًا﴾ في سورة المزمل؟',['﴿إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ أَشَدُّ وَطۡـٔٗا وَأَقۡوَمُ قِيلًا﴾','﴿أَوۡ زِدۡ عَلَيۡهِ وَرَتِّلِ ٱلۡقُرۡءَانَ تَرۡتِيلًا﴾','﴿نِّصۡفَهُۥٓ أَوِ ٱنقُصۡ مِنۡهُ قَلِيلًا﴾','﴿رَّبُّ ٱلۡمَشۡرِقِ وَٱلۡمَغۡرِبِ لَآ إِلَٰهَ إِلَّا هُوَ فَٱتَّخِذۡهُ وَكِيلٗا﴾'],'سورة المزمل، الآية 6'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿كَلَّآ إِنَّهُۥ تَذۡكِرَةٞ﴾ في سورة المدثر؟',['﴿فَمَن شَآءَ ذَكَرَهُۥ﴾','﴿ثُمَّ قُتِلَ كَيۡفَ قَدَّرَ﴾','﴿لَا تُبۡقِي وَلَا تَذَرُ﴾','﴿ثُمَّ أَدۡبَرَ وَٱسۡتَكۡبَرَ﴾'],'سورة المدثر، الآية 55'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿عَلَى ٱلۡكَٰفِرِينَ غَيۡرُ يَسِيرٖ﴾ في سورة المدثر؟',['﴿ذَرۡنِي وَمَنۡ خَلَقۡتُ وَحِيدٗا﴾','﴿وَبَنِينَ شُهُودٗا﴾','﴿كَلَّآۖ إِنَّهُۥ كَانَ لِأٓيَٰتِنَا عَنِيدٗا﴾','﴿إِنَّهَا لَإِحۡدَى ٱلۡكُبَرِ﴾'],'سورة المدثر، الآية 11'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿إِنَّهَا لَإِحۡدَى ٱلۡكُبَرِ﴾ في سورة المدثر؟',['﴿نَذِيرٗا لِّلۡبَشَرِ﴾','﴿كَلَّآ إِنَّهُۥ تَذۡكِرَةٞ﴾','﴿فَمَن شَآءَ ذَكَرَهُۥ﴾','﴿ثُمَّ نَظَرَ﴾'],'سورة المدثر، الآية 36'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿كَلَّا بَلۡ تُحِبُّونَ ٱلۡعَاجِلَةَ﴾ في سورة القيامة؟',['﴿وَتَذَرُونَ ٱلۡأٓخِرَةَ﴾','﴿يَسۡـَٔلُ أَيَّانَ يَوۡمُ ٱلۡقِيَٰمَةِ﴾','﴿وَظَنَّ أَنَّهُ ٱلۡفِرَاقُ﴾','﴿يُنَبَّؤُاْ ٱلۡإِنسَٰنُ يَوۡمَئِذِۭ بِمَا قَدَّمَ وَأَخَّرَ﴾'],'سورة القيامة، الآية 21'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿فَإِذَا قَرَأۡنَٰهُ فَٱتَّبِعۡ قُرۡءَانَهُۥ﴾ في سورة القيامة؟',['﴿ثُمَّ إِنَّ عَلَيۡنَا بَيَانَهُۥ﴾','﴿وَتَذَرُونَ ٱلۡأٓخِرَةَ﴾','﴿وَخَسَفَ ٱلۡقَمَرُ﴾','﴿لَا تُحَرِّكۡ بِهِۦ لِسَانَكَ لِتَعۡجَلَ بِهِۦٓ﴾'],'سورة القيامة، الآية 19'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿فَإِذَا بَرِقَ ٱلۡبَصَرُ﴾ في سورة القيامة؟',['﴿وَخَسَفَ ٱلۡقَمَرُ﴾','﴿كَلَّآ إِذَا بَلَغَتِ ٱلتَّرَاقِيَ﴾','﴿ثُمَّ ذَهَبَ إِلَىٰٓ أَهۡلِهِۦ يَتَمَطَّىٰٓ﴾','﴿يَقُولُ ٱلۡإِنسَٰنُ يَوۡمَئِذٍ أَيۡنَ ٱلۡمَفَرُّ﴾'],'سورة القيامة، الآية 8'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمٗا﴾ في سورة الانسان؟',['﴿يُدۡخِلُ مَن يَشَآءُ فِي رَحۡمَتِهِۦۚ وَٱلظَّـٰلِمِينَ أَعَدَّ لَهُمۡ عَذَابًا أَلِيمَۢا﴾','﴿وَيُسۡقَوۡنَ فِيهَا كَأۡسٗا كَانَ مِزَاجُهَا زَنجَبِيلًا﴾','﴿عَيۡنٗا فِيهَا تُسَمَّىٰ سَلۡسَبِيلٗا﴾','﴿فَوَقَىٰهُمُ ٱللَّهُ شَرَّ ذَٰلِكَ ٱلۡيَوۡمِ وَلَقَّىٰهُمۡ نَضۡرَةٗ وَسُرُورٗا﴾'],'سورة الانسان، الآية 31'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿وَدَانِيَةً عَلَيۡهِمۡ ظِلَٰلُهَا وَذُلِّلَتۡ قُطُوفُهَا تَذۡلِيلٗا﴾ في سورة الانسان؟',['﴿وَيُطَافُ عَلَيۡهِم بِـَٔانِيَةٖ مِّن فِضَّةٖ وَأَكۡوَابٖ كَانَتۡ قَوَارِيرَا۠﴾','﴿وَيُسۡقَوۡنَ فِيهَا كَأۡسٗا كَانَ مِزَاجُهَا زَنجَبِيلًا﴾','﴿إِنَّ هَٰذَا كَانَ لَكُمۡ جَزَآءٗ وَكَانَ سَعۡيُكُم مَّشۡكُورًا﴾','﴿إِنَّا هَدَيۡنَٰهُ ٱلسَّبِيلَ إِمَّا شَاكِرٗا وَإِمَّا كَفُورًا﴾'],'سورة الانسان، الآية 15'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿إِنَّمَا نُطۡعِمُكُمۡ لِوَجۡهِ ٱللَّهِ لَا نُرِيدُ مِنكُمۡ جَزَآءٗ وَلَا شُكُورًا﴾ في سورة الانسان؟',['﴿إِنَّا نَخَافُ مِن رَّبِّنَا يَوۡمًا عَبُوسٗا قَمۡطَرِيرٗا﴾','﴿إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلٗا﴾','﴿إِنَّ هَـٰٓؤُلَآءِ يُحِبُّونَ ٱلۡعَاجِلَةَ وَيَذَرُونَ وَرَآءَهُمۡ يَوۡمٗا ثَقِيلٗا﴾','﴿وَيُطۡعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسۡكِينٗا وَيَتِيمٗا وَأَسِيرًا﴾'],'سورة الانسان، الآية 10'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَا كُنتُمۡ تَعۡمَلُونَ﴾ في سورة المرسلات؟',['﴿إِنَّا كَذَٰلِكَ نَجۡزِي ٱلۡمُحۡسِنِينَ﴾','﴿أَلَمۡ نُهۡلِكِ ٱلۡأَوَّلِينَ﴾','﴿أَلَمۡ نَجۡعَلِ ٱلۡأَرۡضَ كِفَاتًا﴾','﴿فَٱلۡفَٰرِقَٰتِ فَرۡقٗا﴾'],'سورة المرسلات، الآية 44'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿أَلَمۡ نَجۡعَلِ ٱلۡأَرۡضَ كِفَاتًا﴾ في سورة المرسلات؟',['﴿أَحۡيَآءٗ وَأَمۡوَٰتٗا﴾','﴿إِلَىٰ قَدَرٖ مَّعۡلُومٖ﴾','﴿ٱنطَلِقُوٓاْ إِلَىٰ مَا كُنتُم بِهِۦ تُكَذِّبُونَ﴾','﴿وَمَآ أَدۡرَىٰكَ مَا يَوۡمُ ٱلۡفَصۡلِ﴾'],'سورة المرسلات، الآية 26'],
['q',3,'ما الآية التي تلي قوله تعالى: ﴿فَجَعَلۡنَٰهُ فِي قَرَارٖ مَّكِينٍ﴾ في سورة المرسلات؟',['﴿إِلَىٰ قَدَرٖ مَّعۡلُومٖ﴾','﴿فَٱلۡفَٰرِقَٰتِ فَرۡقٗا﴾','﴿فَٱلۡمُلۡقِيَٰتِ ذِكۡرًا﴾','﴿لِأَيِّ يَوۡمٍ أُجِّلَتۡ﴾'],'سورة المرسلات، الآية 22'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿كَلَّا سَيَعۡلَمُونَ﴾ في سورة النبإ؟',['﴿ثُمَّ كَلَّا سَيَعۡلَمُونَ﴾','﴿وَجَعَلۡنَا سِرَاجٗا وَهَّاجٗا﴾','﴿لَّا يَذُوقُونَ فِيهَا بَرۡدٗا وَلَا شَرَابًا﴾','﴿وَفُتِحَتِ ٱلسَّمَآءُ فَكَانَتۡ أَبۡوَٰبٗا﴾'],'سورة النبإ، الآية 5'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿لَّـٰبِثِينَ فِيهَآ أَحۡقَابٗا﴾ في سورة النبإ؟',['﴿لَّا يَذُوقُونَ فِيهَا بَرۡدٗا وَلَا شَرَابًا﴾','﴿لَّا يَسۡمَعُونَ فِيهَا لَغۡوٗا وَلَا كِذَّـٰبٗا﴾','﴿أَلَمۡ نَجۡعَلِ ٱلۡأَرۡضَ مِهَٰدٗا﴾','﴿حَدَآئِقَ وَأَعۡنَٰبٗا﴾'],'سورة النبإ، الآية 24'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَفُتِحَتِ ٱلسَّمَآءُ فَكَانَتۡ أَبۡوَٰبٗا﴾ في سورة النبإ؟',['﴿وَسُيِّرَتِ ٱلۡجِبَالُ فَكَانَتۡ سَرَابًا﴾','﴿إِنَّ لِلۡمُتَّقِينَ مَفَازًا﴾','﴿لَّا يَسۡمَعُونَ فِيهَا لَغۡوٗا وَلَا كِذَّـٰبٗا﴾','﴿وَجَعَلۡنَا ٱلنَّهَارَ مَعَاشٗا﴾'],'سورة النبإ، الآية 20'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَٱلۡجِبَالَ أَرۡسَىٰهَا﴾ في سورة النازعات؟',['﴿مَتَٰعٗا لَّكُمۡ وَلِأَنۡعَٰمِكُمۡ﴾','﴿أَخۡرَجَ مِنۡهَا مَآءَهَا وَمَرۡعَىٰهَا﴾','﴿ءَأَنتُمۡ أَشَدُّ خَلۡقًا أَمِ ٱلسَّمَآءُۚ بَنَىٰهَا﴾','﴿أَبۡصَٰرُهَا خَٰشِعَةٞ﴾'],'سورة النازعات، الآية 33'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿فَقُلۡ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ﴾ في سورة النازعات؟',['﴿وَأَهۡدِيَكَ إِلَىٰ رَبِّكَ فَتَخۡشَىٰ﴾','﴿وَأَمَّا مَنۡ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفۡسَ عَنِ ٱلۡهَوَىٰ﴾','﴿إِنَّمَآ أَنتَ مُنذِرُ مَن يَخۡشَىٰهَا﴾','﴿هَلۡ أَتَىٰكَ حَدِيثُ مُوسَىٰٓ﴾'],'سورة النازعات، الآية 19'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَأَمَّا مَنۡ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفۡسَ عَنِ ٱلۡهَوَىٰ﴾ في سورة النازعات؟',['﴿فَإِنَّ ٱلۡجَنَّةَ هِيَ ٱلۡمَأۡوَىٰ﴾','﴿مَتَٰعٗا لَّكُمۡ وَلِأَنۡعَٰمِكُمۡ﴾','﴿فَإِنَّ ٱلۡجَحِيمَ هِيَ ٱلۡمَأۡوَىٰ﴾','﴿أَبۡصَٰرُهَا خَٰشِعَةٞ﴾'],'سورة النازعات، الآية 41'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَوُجُوهٞ يَوۡمَئِذٍ عَلَيۡهَا غَبَرَةٞ﴾ في سورة عبس؟',['﴿تَرۡهَقُهَا قَتَرَةٌ﴾','﴿أَنَّا صَبَبۡنَا ٱلۡمَآءَ صَبّٗا﴾','﴿وَأُمِّهِۦ وَأَبِيهِ﴾','﴿وَحَدَآئِقَ غُلۡبٗا﴾'],'سورة عبس، الآية 41'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَأُمِّهِۦ وَأَبِيهِ﴾ في سورة عبس؟',['﴿وَصَٰحِبَتِهِۦ وَبَنِيهِ﴾','﴿وَهُوَ يَخۡشَىٰ﴾','﴿لِكُلِّ ٱمۡرِيٕٖ مِّنۡهُمۡ يَوۡمَئِذٖ شَأۡنٞ يُغۡنِيهِ﴾','﴿تَرۡهَقُهَا قَتَرَةٌ﴾'],'سورة عبس، الآية 36'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿ثُمَّ شَقَقۡنَا ٱلۡأَرۡضَ شَقّٗا﴾ في سورة عبس؟',['﴿فَأَنۢبَتۡنَا فِيهَا حَبّٗا﴾','﴿ثُمَّ أَمَاتَهُۥ فَأَقۡبَرَهُۥ﴾','﴿مَّتَٰعٗا لَّكُمۡ وَلِأَنۡعَٰمِكُمۡ﴾','﴿وَمَا يُدۡرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ﴾'],'سورة عبس، الآية 27'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿إِنۡ هُوَ إِلَّا ذِكۡرٞ لِّلۡعَٰلَمِينَ﴾ في سورة التكوير؟',['﴿لِمَن شَآءَ مِنكُمۡ أَن يَسۡتَقِيمَ﴾','﴿وَمَا هُوَ عَلَى ٱلۡغَيۡبِ بِضَنِينٖ﴾','﴿وَمَا صَاحِبُكُم بِمَجۡنُونٖ﴾','﴿ٱلۡجَوَارِ ٱلۡكُنَّسِ﴾'],'سورة التكوير، الآية 28'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَإِذَا ٱلۡبِحَارُ سُجِّرَتۡ﴾ في سورة التكوير؟',['﴿وَإِذَا ٱلنُّفُوسُ زُوِّجَتۡ﴾','﴿فَأَيۡنَ تَذۡهَبُونَ﴾','﴿وَمَا هُوَ عَلَى ٱلۡغَيۡبِ بِضَنِينٖ﴾','﴿إِنَّهُۥ لَقَوۡلُ رَسُولٖ كَرِيمٖ﴾'],'سورة التكوير، الآية 7'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿ٱلۡجَوَارِ ٱلۡكُنَّسِ﴾ في سورة التكوير؟',['﴿وَٱلَّيۡلِ إِذَا عَسۡعَسَ﴾','﴿بِأَيِّ ذَنۢبٖ قُتِلَتۡ﴾','﴿وَمَا هُوَ عَلَى ٱلۡغَيۡبِ بِضَنِينٖ﴾','﴿وَإِذَا ٱلۡجَنَّةُ أُزۡلِفَتۡ﴾'],'سورة التكوير، الآية 17'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿إِذَا ٱلسَّمَآءُ ٱنفَطَرَتۡ﴾ في سورة الإنفطار؟',['﴿وَإِذَا ٱلۡكَوَاكِبُ ٱنتَثَرَتۡ﴾','﴿ٱلَّذِي خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ﴾','﴿كِرَامٗا كَٰتِبِينَ﴾','﴿وَإِذَا ٱلۡبِحَارُ فُجِّرَتۡ﴾'],'سورة الإنفطار، الآية 2'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَإِذَا ٱلۡبِحَارُ فُجِّرَتۡ﴾ في سورة الإنفطار؟',['﴿وَإِذَا ٱلۡقُبُورُ بُعۡثِرَتۡ﴾','﴿يَـٰٓأَيُّهَا ٱلۡإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلۡكَرِيمِ﴾','﴿يَعۡلَمُونَ مَا تَفۡعَلُونَ﴾','﴿يَصۡلَوۡنَهَا يَوۡمَ ٱلدِّينِ﴾'],'سورة الإنفطار، الآية 4'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَإِنَّ عَلَيۡكُمۡ لَحَٰفِظِينَ﴾ في سورة الإنفطار؟',['﴿كِرَامٗا كَٰتِبِينَ﴾','﴿وَإِذَا ٱلۡكَوَاكِبُ ٱنتَثَرَتۡ﴾','﴿فِيٓ أَيِّ صُورَةٖ مَّا شَآءَ رَكَّبَكَ﴾','﴿وَمَآ أَدۡرَىٰكَ مَا يَوۡمُ ٱلدِّينِ﴾'],'سورة الإنفطار، الآية 11'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿ٱلَّذِينَ يُكَذِّبُونَ بِيَوۡمِ ٱلدِّينِ﴾ في سورة المطففين؟',['﴿وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعۡتَدٍ أَثِيمٍ﴾','﴿كَلَّآ إِنَّهُمۡ عَن رَّبِّهِمۡ يَوۡمَئِذٖ لَّمَحۡجُوبُونَ﴾','﴿وَمَآ أُرۡسِلُواْ عَلَيۡهِمۡ حَٰفِظِينَ﴾','﴿يُسۡقَوۡنَ مِن رَّحِيقٖ مَّخۡتُومٍ﴾'],'سورة المطففين، الآية 12'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿كَلَّاۖ بَلۡۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ﴾ في سورة المطففين؟',['﴿كَلَّآ إِنَّهُمۡ عَن رَّبِّهِمۡ يَوۡمَئِذٖ لَّمَحۡجُوبُونَ﴾','﴿يَوۡمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلۡعَٰلَمِينَ﴾','﴿ثُمَّ يُقَالُ هَٰذَا ٱلَّذِي كُنتُم بِهِۦ تُكَذِّبُونَ﴾','﴿وَمَآ أَدۡرَىٰكَ مَا سِجِّينٞ﴾'],'سورة المطففين، الآية 15'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَإِذَا رَأَوۡهُمۡ قَالُوٓاْ إِنَّ هَـٰٓؤُلَآءِ لَضَآلُّونَ﴾ في سورة المطففين؟',['﴿وَمَآ أُرۡسِلُواْ عَلَيۡهِمۡ حَٰفِظِينَ﴾','﴿لِيَوۡمٍ عَظِيمٖ﴾','﴿كَلَّاۖ بَلۡۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ﴾','﴿فَٱلۡيَوۡمَ ٱلَّذِينَ ءَامَنُواْ مِنَ ٱلۡكُفَّارِ يَضۡحَكُونَ﴾'],'سورة المطففين، الآية 33'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ وَرَآءَ ظَهۡرِهِۦ﴾ في سورة الإنشقاق؟',['﴿فَسَوۡفَ يَدۡعُواْ ثُبُورٗا﴾','﴿لَتَرۡكَبُنَّ طَبَقًا عَن طَبَقٖ﴾','﴿وَأَلۡقَتۡ مَا فِيهَا وَتَخَلَّتۡ﴾','﴿فَسَوۡفَ يُحَاسَبُ حِسَابٗا يَسِيرٗا﴾'],'سورة الإنشقاق، الآية 11'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿فَلَآ أُقۡسِمُ بِٱلشَّفَقِ﴾ في سورة الإنشقاق؟',['﴿وَٱلَّيۡلِ وَمَا وَسَقَ﴾','﴿لَتَرۡكَبُنَّ طَبَقًا عَن طَبَقٖ﴾','﴿إِذَا ٱلسَّمَآءُ ٱنشَقَّتۡ﴾','﴿وَأَلۡقَتۡ مَا فِيهَا وَتَخَلَّتۡ﴾'],'سورة الإنشقاق، الآية 17'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَيَنقَلِبُ إِلَىٰٓ أَهۡلِهِۦ مَسۡرُورٗا﴾ في سورة الإنشقاق؟',['﴿وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ وَرَآءَ ظَهۡرِهِۦ﴾','﴿وَٱلۡقَمَرِ إِذَا ٱتَّسَقَ﴾','﴿إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ لَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونِۭ﴾','﴿وَٱللَّهُ أَعۡلَمُ بِمَا يُوعُونَ﴾'],'سورة الإنشقاق، الآية 10'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿بَلۡ هُوَ قُرۡءَانٞ مَّجِيدٞ﴾ في سورة البروج؟',['﴿فِي لَوۡحٖ مَّحۡفُوظِۭ﴾','﴿وَهُوَ ٱلۡغَفُورُ ٱلۡوَدُودُ﴾','﴿بَلِ ٱلَّذِينَ كَفَرُواْ فِي تَكۡذِيبٖ﴾','﴿ٱلنَّارِ ذَاتِ ٱلۡوَقُودِ﴾'],'سورة البروج، الآية 22'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿هَلۡ أَتَىٰكَ حَدِيثُ ٱلۡجُنُودِ﴾ في سورة البروج؟',['﴿فِرۡعَوۡنَ وَثَمُودَ﴾','﴿وَمَا نَقَمُواْ مِنۡهُمۡ إِلَّآ أَن يُؤۡمِنُواْ بِٱللَّهِ ٱلۡعَزِيزِ ٱلۡحَمِيدِ﴾','﴿إِنَّهُۥ هُوَ يُبۡدِئُ وَيُعِيدُ﴾','﴿إِذۡ هُمۡ عَلَيۡهَا قُعُودٞ﴾'],'سورة البروج، الآية 18'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿إِذۡ هُمۡ عَلَيۡهَا قُعُودٞ﴾ في سورة البروج؟',['﴿وَهُمۡ عَلَىٰ مَا يَفۡعَلُونَ بِٱلۡمُؤۡمِنِينَ شُهُودٞ﴾','﴿ٱلَّذِي لَهُۥ مُلۡكُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۚ وَٱللَّهُ عَلَىٰ كُلِّ شَيۡءٖ شَهِيدٌ﴾','﴿بَلۡ هُوَ قُرۡءَانٞ مَّجِيدٞ﴾','﴿فَعَّالٞ لِّمَا يُرِيدُ﴾'],'سورة البروج، الآية 7'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿إِنَّهُۥ عَلَىٰ رَجۡعِهِۦ لَقَادِرٞ﴾ في سورة الطارق؟',['﴿يَوۡمَ تُبۡلَى ٱلسَّرَآئِرُ﴾','﴿إِن كُلُّ نَفۡسٖ لَّمَّا عَلَيۡهَا حَافِظٞ﴾','﴿ٱلنَّجۡمُ ٱلثَّاقِبُ﴾','﴿إِنَّهُۥ لَقَوۡلٞ فَصۡلٞ﴾'],'سورة الطارق، الآية 9'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿إِنَّهُمۡ يَكِيدُونَ كَيۡدٗا﴾ في سورة الطارق؟',['﴿وَأَكِيدُ كَيۡدٗا﴾','﴿إِن كُلُّ نَفۡسٖ لَّمَّا عَلَيۡهَا حَافِظٞ﴾','﴿إِنَّهُۥ عَلَىٰ رَجۡعِهِۦ لَقَادِرٞ﴾','﴿وَٱلسَّمَآءِ وَٱلطَّارِقِ﴾'],'سورة الطارق، الآية 16'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَٱلسَّمَآءِ ذَاتِ ٱلرَّجۡعِ﴾ في سورة الطارق؟',['﴿وَٱلۡأَرۡضِ ذَاتِ ٱلصَّدۡعِ﴾','﴿إِن كُلُّ نَفۡسٖ لَّمَّا عَلَيۡهَا حَافِظٞ﴾','﴿فَلۡيَنظُرِ ٱلۡإِنسَٰنُ مِمَّ خُلِقَ﴾','﴿يَوۡمَ تُبۡلَى ٱلسَّرَآئِرُ﴾'],'سورة الطارق، الآية 12'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿إِنَّ هَٰذَا لَفِي ٱلصُّحُفِ ٱلۡأُولَىٰ﴾ في سورة الأعلى؟',['﴿صُحُفِ إِبۡرَٰهِيمَ وَمُوسَىٰ﴾','﴿سَيَذَّكَّرُ مَن يَخۡشَىٰ﴾','﴿وَٱلۡأٓخِرَةُ خَيۡرٞ وَأَبۡقَىٰٓ﴾','﴿سَنُقۡرِئُكَ فَلَا تَنسَىٰٓ﴾'],'سورة الأعلى، الآية 19'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَيَتَجَنَّبُهَا ٱلۡأَشۡقَى﴾ في سورة الأعلى؟',['﴿ٱلَّذِي يَصۡلَى ٱلنَّارَ ٱلۡكُبۡرَىٰ﴾','﴿سَبِّحِ ٱسۡمَ رَبِّكَ ٱلۡأَعۡلَى﴾','﴿سَنُقۡرِئُكَ فَلَا تَنسَىٰٓ﴾','﴿وَذَكَرَ ٱسۡمَ رَبِّهِۦ فَصَلَّىٰ﴾'],'سورة الأعلى، الآية 12'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿فَذَكِّرۡ إِن نَّفَعَتِ ٱلذِّكۡرَىٰ﴾ في سورة الأعلى؟',['﴿سَيَذَّكَّرُ مَن يَخۡشَىٰ﴾','﴿ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحۡيَىٰ﴾','﴿إِلَّا مَا شَآءَ ٱللَّهُۚ إِنَّهُۥ يَعۡلَمُ ٱلۡجَهۡرَ وَمَا يَخۡفَىٰ﴾','﴿بَلۡ تُؤۡثِرُونَ ٱلۡحَيَوٰةَ ٱلدُّنۡيَا﴾'],'سورة الأعلى، الآية 10'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿تُسۡقَىٰ مِنۡ عَيۡنٍ ءَانِيَةٖ﴾ في سورة الغاشية؟',['﴿لَّيۡسَ لَهُمۡ طَعَامٌ إِلَّا مِن ضَرِيعٖ﴾','﴿ثُمَّ إِنَّ عَلَيۡنَا حِسَابَهُم﴾','﴿أَفَلَا يَنظُرُونَ إِلَى ٱلۡإِبِلِ كَيۡفَ خُلِقَتۡ﴾','﴿وَإِلَى ٱلسَّمَآءِ كَيۡفَ رُفِعَتۡ﴾'],'سورة الغاشية، الآية 6'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَزَرَابِيُّ مَبۡثُوثَةٌ﴾ في سورة الغاشية؟',['﴿أَفَلَا يَنظُرُونَ إِلَى ٱلۡإِبِلِ كَيۡفَ خُلِقَتۡ﴾','﴿لَّسۡتَ عَلَيۡهِم بِمُصَيۡطِرٍ﴾','﴿إِلَّا مَن تَوَلَّىٰ وَكَفَرَ﴾','﴿عَامِلَةٞ نَّاصِبَةٞ﴾'],'سورة الغاشية، الآية 17'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿فَذَكِّرۡ إِنَّمَآ أَنتَ مُذَكِّرٞ﴾ في سورة الغاشية؟',['﴿لَّسۡتَ عَلَيۡهِم بِمُصَيۡطِرٍ﴾','﴿ثُمَّ إِنَّ عَلَيۡنَا حِسَابَهُم﴾','﴿لَّا يُسۡمِنُ وَلَا يُغۡنِي مِن جُوعٖ﴾','﴿وَإِلَى ٱلسَّمَآءِ كَيۡفَ رُفِعَتۡ﴾'],'سورة الغاشية، الآية 22'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَتَأۡكُلُونَ ٱلتُّرَاثَ أَكۡلٗا لَّمّٗا﴾ في سورة الفجر؟',['﴿وَتُحِبُّونَ ٱلۡمَالَ حُبّٗا جَمّٗا﴾','﴿وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٞ﴾','﴿وَثَمُودَ ٱلَّذِينَ جَابُواْ ٱلصَّخۡرَ بِٱلۡوَادِ﴾','﴿ٱرۡجِعِيٓ إِلَىٰ رَبِّكِ رَاضِيَةٗ مَّرۡضِيَّةٗ﴾'],'سورة الفجر، الآية 20'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿كَلَّآۖ إِذَا دُكَّتِ ٱلۡأَرۡضُ دَكّٗا دَكّٗا﴾ في سورة الفجر؟',['﴿وَجَآءَ رَبُّكَ وَٱلۡمَلَكُ صَفّٗا صَفّٗا﴾','﴿هَلۡ فِي ذَٰلِكَ قَسَمٞ لِّذِي حِجۡرٍ﴾','﴿وَتُحِبُّونَ ٱلۡمَالَ حُبّٗا جَمّٗا﴾','﴿إِنَّ رَبَّكَ لَبِٱلۡمِرۡصَادِ﴾'],'سورة الفجر، الآية 22'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَٱلشَّفۡعِ وَٱلۡوَتۡرِ﴾ في سورة الفجر؟',['﴿وَٱلَّيۡلِ إِذَا يَسۡرِ﴾','﴿إِرَمَ ذَاتِ ٱلۡعِمَادِ﴾','﴿وَتَأۡكُلُونَ ٱلتُّرَاثَ أَكۡلٗا لَّمّٗا﴾','﴿وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٞ﴾'],'سورة الفجر، الآية 4'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿لَآ أُقۡسِمُ بِهَٰذَا ٱلۡبَلَدِ﴾ في سورة البلد؟',['﴿وَأَنتَ حِلُّۢ بِهَٰذَا ٱلۡبَلَدِ﴾','﴿وَمَآ أَدۡرَىٰكَ مَا ٱلۡعَقَبَةُ﴾','﴿يَتِيمٗا ذَا مَقۡرَبَةٍ﴾','﴿فَلَا ٱقۡتَحَمَ ٱلۡعَقَبَةَ﴾'],'سورة البلد، الآية 2'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿أَوۡ مِسۡكِينٗا ذَا مَتۡرَبَةٖ﴾ في سورة البلد؟',['﴿ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُواْ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ وَتَوَاصَوۡاْ بِٱلۡمَرۡحَمَةِ﴾','﴿وَمَآ أَدۡرَىٰكَ مَا ٱلۡعَقَبَةُ﴾','﴿يَقُولُ أَهۡلَكۡتُ مَالٗا لُّبَدًا﴾','﴿وَوَالِدٖ وَمَا وَلَدَ﴾'],'سورة البلد، الآية 17'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُواْ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ وَتَوَاصَوۡاْ بِٱلۡمَرۡحَمَةِ﴾ في سورة البلد؟',['﴿أُوْلَـٰٓئِكَ أَصۡحَٰبُ ٱلۡمَيۡمَنَةِ﴾','﴿يَتِيمٗا ذَا مَقۡرَبَةٍ﴾','﴿وَمَآ أَدۡرَىٰكَ مَا ٱلۡعَقَبَةُ﴾','﴿يَقُولُ أَهۡلَكۡتُ مَالٗا لُّبَدًا﴾'],'سورة البلد، الآية 18'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿فَأَلۡهَمَهَا فُجُورَهَا وَتَقۡوَىٰهَا﴾ في سورة الشمس؟',['﴿قَدۡ أَفۡلَحَ مَن زَكَّىٰهَا﴾','﴿وَقَدۡ خَابَ مَن دَسَّىٰهَا﴾','﴿وَنَفۡسٖ وَمَا سَوَّىٰهَا﴾','﴿وَٱلۡأَرۡضِ وَمَا طَحَىٰهَا﴾'],'سورة الشمس، الآية 9'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَنَفۡسٖ وَمَا سَوَّىٰهَا﴾ في سورة الشمس؟',['﴿فَأَلۡهَمَهَا فُجُورَهَا وَتَقۡوَىٰهَا﴾','﴿وَلَا يَخَافُ عُقۡبَٰهَا﴾','﴿فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمۡدَمَ عَلَيۡهِمۡ رَبُّهُم بِذَنۢبِهِمۡ فَسَوَّىٰهَا﴾','﴿وَٱلۡقَمَرِ إِذَا تَلَىٰهَا﴾'],'سورة الشمس، الآية 8'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿قَدۡ أَفۡلَحَ مَن زَكَّىٰهَا﴾ في سورة الشمس؟',['﴿وَقَدۡ خَابَ مَن دَسَّىٰهَا﴾','﴿إِذِ ٱنۢبَعَثَ أَشۡقَىٰهَا﴾','﴿وَٱلشَّمۡسِ وَضُحَىٰهَا﴾','﴿وَٱلۡأَرۡضِ وَمَا طَحَىٰهَا﴾'],'سورة الشمس، الآية 10'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿فَسَنُيَسِّرُهُۥ لِلۡيُسۡرَىٰ﴾ في سورة الليل؟',['﴿وَأَمَّا مَنۢ بَخِلَ وَٱسۡتَغۡنَىٰ﴾','﴿إِنَّ عَلَيۡنَا لَلۡهُدَىٰ﴾','﴿لَا يَصۡلَىٰهَآ إِلَّا ٱلۡأَشۡقَى﴾','﴿وَإِنَّ لَنَا لَلۡأٓخِرَةَ وَٱلۡأُولَىٰ﴾'],'سورة الليل، الآية 8'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَإِنَّ لَنَا لَلۡأٓخِرَةَ وَٱلۡأُولَىٰ﴾ في سورة الليل؟',['﴿فَأَنذَرۡتُكُمۡ نَارٗا تَلَظَّىٰ﴾','﴿وَكَذَّبَ بِٱلۡحُسۡنَىٰ﴾','﴿وَٱلنَّهَارِ إِذَا تَجَلَّىٰ﴾','﴿وَصَدَّقَ بِٱلۡحُسۡنَىٰ﴾'],'سورة الليل، الآية 14'],
['q',2,'ما الآية التي تلي قوله تعالى: ﴿وَٱلنَّهَارِ إِذَا تَجَلَّىٰ﴾ في سورة الليل؟',['﴿وَمَا خَلَقَ ٱلذَّكَرَ وَٱلۡأُنثَىٰٓ﴾','﴿إِلَّا ٱبۡتِغَآءَ وَجۡهِ رَبِّهِ ٱلۡأَعۡلَىٰ﴾','﴿لَا يَصۡلَىٰهَآ إِلَّا ٱلۡأَشۡقَى﴾','﴿وَلَسَوۡفَ يَرۡضَىٰ﴾'],'سورة الليل، الآية 3'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ﴾ في سورة الضحى؟',['﴿وَلَلۡأٓخِرَةُ خَيۡرٞ لَّكَ مِنَ ٱلۡأُولَىٰ﴾','﴿أَلَمۡ يَجِدۡكَ يَتِيمٗا فَـَٔاوَىٰ﴾','﴿وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ﴾','﴿وَٱلضُّحَىٰ﴾'],'سورة الضحى، الآية 4'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿أَلَمۡ يَجِدۡكَ يَتِيمٗا فَـَٔاوَىٰ﴾ في سورة الضحى؟',['﴿وَوَجَدَكَ ضَآلّٗا فَهَدَىٰ﴾','﴿وَلَسَوۡفَ يُعۡطِيكَ رَبُّكَ فَتَرۡضَىٰٓ﴾','﴿وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ﴾','﴿وَلَلۡأٓخِرَةُ خَيۡرٞ لَّكَ مِنَ ٱلۡأُولَىٰ﴾'],'سورة الضحى، الآية 7'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿وَوَجَدَكَ ضَآلّٗا فَهَدَىٰ﴾ في سورة الضحى؟',['﴿وَوَجَدَكَ عَآئِلٗا فَأَغۡنَىٰ﴾','﴿وَلَلۡأٓخِرَةُ خَيۡرٞ لَّكَ مِنَ ٱلۡأُولَىٰ﴾','﴿مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ﴾','﴿وَأَمَّا ٱلسَّآئِلَ فَلَا تَنۡهَرۡ﴾'],'سورة الضحى، الآية 8'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿وَوَضَعۡنَا عَنكَ وِزۡرَكَ﴾ في سورة الشرح؟',['﴿ٱلَّذِيٓ أَنقَضَ ظَهۡرَكَ﴾','﴿فَإِذَا فَرَغۡتَ فَٱنصَبۡ﴾','﴿أَلَمۡ نَشۡرَحۡ لَكَ صَدۡرَكَ﴾','﴿إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرٗا﴾'],'سورة الشرح، الآية 3'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا﴾ في سورة الشرح؟',['﴿إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرٗا﴾','﴿وَرَفَعۡنَا لَكَ ذِكۡرَكَ﴾','﴿فَإِذَا فَرَغۡتَ فَٱنصَبۡ﴾','﴿وَوَضَعۡنَا عَنكَ وِزۡرَكَ﴾'],'سورة الشرح، الآية 6'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿فَإِذَا فَرَغۡتَ فَٱنصَبۡ﴾ في سورة الشرح؟',['﴿وَإِلَىٰ رَبِّكَ فَٱرۡغَب﴾','﴿إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرٗا﴾','﴿وَوَضَعۡنَا عَنكَ وِزۡرَكَ﴾','﴿أَلَمۡ نَشۡرَحۡ لَكَ صَدۡرَكَ﴾'],'سورة الشرح، الآية 8'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ فَلَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونٖ﴾ في سورة التين؟',['﴿فَمَا يُكَذِّبُكَ بَعۡدُ بِٱلدِّينِ﴾','﴿لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِيٓ أَحۡسَنِ تَقۡوِيمٖ﴾','﴿أَلَيۡسَ ٱللَّهُ بِأَحۡكَمِ ٱلۡحَٰكِمِينَ﴾','﴿وَهَٰذَا ٱلۡبَلَدِ ٱلۡأَمِينِ﴾'],'سورة التين، الآية 7'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿فَمَا يُكَذِّبُكَ بَعۡدُ بِٱلدِّينِ﴾ في سورة التين؟',['﴿أَلَيۡسَ ٱللَّهُ بِأَحۡكَمِ ٱلۡحَٰكِمِينَ﴾','﴿إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ فَلَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونٖ﴾','﴿وَٱلتِّينِ وَٱلزَّيۡتُونِ﴾','﴿وَهَٰذَا ٱلۡبَلَدِ ٱلۡأَمِينِ﴾'],'سورة التين، الآية 8'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِيٓ أَحۡسَنِ تَقۡوِيمٖ﴾ في سورة التين؟',['﴿ثُمَّ رَدَدۡنَٰهُ أَسۡفَلَ سَٰفِلِينَ﴾','﴿وَطُورِ سِينِينَ﴾','﴿أَلَيۡسَ ٱللَّهُ بِأَحۡكَمِ ٱلۡحَٰكِمِينَ﴾','﴿وَٱلتِّينِ وَٱلزَّيۡتُونِ﴾'],'سورة التين، الآية 5'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿أَرَءَيۡتَ ٱلَّذِي يَنۡهَىٰ﴾ في سورة العلق؟',['﴿عَبۡدًا إِذَا صَلَّىٰٓ﴾','﴿أَن رَّءَاهُ ٱسۡتَغۡنَىٰٓ﴾','﴿خَلَقَ ٱلۡإِنسَٰنَ مِنۡ عَلَقٍ﴾','﴿سَنَدۡعُ ٱلزَّبَانِيَةَ﴾'],'سورة العلق، الآية 10'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿نَاصِيَةٖ كَٰذِبَةٍ خَاطِئَةٖ﴾ في سورة العلق؟',['﴿فَلۡيَدۡعُ نَادِيَهُۥ﴾','﴿خَلَقَ ٱلۡإِنسَٰنَ مِنۡ عَلَقٍ﴾','﴿أَرَءَيۡتَ إِن كَذَّبَ وَتَوَلَّىٰٓ﴾','﴿كَلَّآ إِنَّ ٱلۡإِنسَٰنَ لَيَطۡغَىٰٓ﴾'],'سورة العلق، الآية 17'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿خَلَقَ ٱلۡإِنسَٰنَ مِنۡ عَلَقٍ﴾ في سورة العلق؟',['﴿ٱقۡرَأۡ وَرَبُّكَ ٱلۡأَكۡرَمُ﴾','﴿فَلۡيَدۡعُ نَادِيَهُۥ﴾','﴿ٱقۡرَأۡ بِٱسۡمِ رَبِّكَ ٱلَّذِي خَلَقَ﴾','﴿عَبۡدًا إِذَا صَلَّىٰٓ﴾'],'سورة العلق، الآية 3'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿تَنَزَّلُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرٖ﴾ في سورة القدر؟',['﴿سَلَٰمٌ هِيَ حَتَّىٰ مَطۡلَعِ ٱلۡفَجۡرِ﴾','﴿لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرٞ مِّنۡ أَلۡفِ شَهۡرٖ﴾','﴿إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ﴾','﴿وَمَآ أَدۡرَىٰكَ مَا لَيۡلَةُ ٱلۡقَدۡرِ﴾'],'سورة القدر، الآية 5'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ﴾ في سورة القدر؟',['﴿وَمَآ أَدۡرَىٰكَ مَا لَيۡلَةُ ٱلۡقَدۡرِ﴾','﴿تَنَزَّلُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرٖ﴾','﴿لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرٞ مِّنۡ أَلۡفِ شَهۡرٖ﴾','﴿سَلَٰمٌ هِيَ حَتَّىٰ مَطۡلَعِ ٱلۡفَجۡرِ﴾'],'سورة القدر، الآية 2'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿وَمَآ أَدۡرَىٰكَ مَا لَيۡلَةُ ٱلۡقَدۡرِ﴾ في سورة القدر؟',['﴿لَيۡلَةُ ٱلۡقَدۡرِ خَيۡرٞ مِّنۡ أَلۡفِ شَهۡرٖ﴾','﴿إِنَّآ أَنزَلۡنَٰهُ فِي لَيۡلَةِ ٱلۡقَدۡرِ﴾','﴿تَنَزَّلُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرٖ﴾','﴿سَلَٰمٌ هِيَ حَتَّىٰ مَطۡلَعِ ٱلۡفَجۡرِ﴾'],'سورة القدر، الآية 3'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ﴾ في سورة الزلزلة؟',['﴿وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ﴾','﴿وَقَالَ ٱلۡإِنسَٰنُ مَا لَهَا﴾','﴿وَأَخۡرَجَتِ ٱلۡأَرۡضُ أَثۡقَالَهَا﴾','﴿بِأَنَّ رَبَّكَ أَوۡحَىٰ لَهَا﴾'],'سورة الزلزلة، الآية 8'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿يَوۡمَئِذٖ يَصۡدُرُ ٱلنَّاسُ أَشۡتَاتٗا لِّيُرَوۡاْ أَعۡمَٰلَهُمۡ﴾ في سورة الزلزلة؟',['﴿فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ﴾','﴿وَأَخۡرَجَتِ ٱلۡأَرۡضُ أَثۡقَالَهَا﴾','﴿وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ﴾','﴿يَوۡمَئِذٖ تُحَدِّثُ أَخۡبَارَهَا﴾'],'سورة الزلزلة، الآية 7'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿بِأَنَّ رَبَّكَ أَوۡحَىٰ لَهَا﴾ في سورة الزلزلة؟',['﴿يَوۡمَئِذٖ يَصۡدُرُ ٱلنَّاسُ أَشۡتَاتٗا لِّيُرَوۡاْ أَعۡمَٰلَهُمۡ﴾','﴿فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ﴾','﴿وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ﴾','﴿وَقَالَ ٱلۡإِنسَٰنُ مَا لَهَا﴾'],'سورة الزلزلة، الآية 6'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿فَٱلۡمُغِيرَٰتِ صُبۡحٗا﴾ في سورة العاديات؟',['﴿فَأَثَرۡنَ بِهِۦ نَقۡعٗا﴾','﴿وَحُصِّلَ مَا فِي ٱلصُّدُورِ﴾','﴿إِنَّ رَبَّهُم بِهِمۡ يَوۡمَئِذٖ لَّخَبِيرُۢ﴾','﴿وَإِنَّهُۥ لِحُبِّ ٱلۡخَيۡرِ لَشَدِيدٌ﴾'],'سورة العاديات، الآية 4'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿۞أَفَلَا يَعۡلَمُ إِذَا بُعۡثِرَ مَا فِي ٱلۡقُبُورِ﴾ في سورة العاديات؟',['﴿وَحُصِّلَ مَا فِي ٱلصُّدُورِ﴾','﴿فَٱلۡمُغِيرَٰتِ صُبۡحٗا﴾','﴿إِنَّ ٱلۡإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٞ﴾','﴿فَأَثَرۡنَ بِهِۦ نَقۡعٗا﴾'],'سورة العاديات، الآية 10'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿وَحُصِّلَ مَا فِي ٱلصُّدُورِ﴾ في سورة العاديات؟',['﴿إِنَّ رَبَّهُم بِهِمۡ يَوۡمَئِذٖ لَّخَبِيرُۢ﴾','﴿۞أَفَلَا يَعۡلَمُ إِذَا بُعۡثِرَ مَا فِي ٱلۡقُبُورِ﴾','﴿وَٱلۡعَٰدِيَٰتِ ضَبۡحٗا﴾','﴿فَأَثَرۡنَ بِهِۦ نَقۡعٗا﴾'],'سورة العاديات، الآية 11'],
['q',1,'ما الآية التي تلي قوله تعالى: ﴿فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ﴾ في سورة القارعة؟',['﴿وَأَمَّا مَنۡ خَفَّتۡ مَوَٰزِينُهُۥ﴾','﴿نَارٌ حَامِيَةُۢ﴾','﴿وَمَآ أَدۡرَىٰكَ مَا ٱلۡقَارِعَةُ﴾','﴿يَوۡمَ يَكُونُ ٱلنَّاسُ كَٱلۡفَرَاشِ ٱلۡمَبۡثُوثِ﴾'],'سورة القارعة، الآية 8'],

[65,3,"الطلاق","وَيَرۡزُقۡهُ مِنۡ حَيۡثُ لَا يَحۡتَسِبُۚ وَمَن يَتَوَكَّلۡ عَلَى ٱللَّهِ فَهُوَ حَسۡبُهُۥٓۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمۡرِهِۦۚ قَدۡ جَعَلَ ٱللَّهُ لِكُلِّ شَيۡءٖ قَدۡرٗا","مَن يعتمد على الله يكفِه ما أهمّه ويرزقه من حيث لا يتوقّع، وأمر الله نافذ، وقد جعل لكلّ شيء مقداراً."],
[39,53,"الزمر","۞قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ","ينهى الله المذنبين عن اليأس من رحمته، فهو يغفر الذنوب كلّها لمن تاب إليه."],
[49,13,"الحجرات","يَـٰٓأَيُّهَا ٱلنَّاسُ إِنَّا خَلَقۡنَٰكُم مِّن ذَكَرٖ وَأُنثَىٰ وَجَعَلۡنَٰكُمۡ شُعُوبٗا وَقَبَآئِلَ لِتَعَارَفُوٓاْۚ إِنَّ أَكۡرَمَكُمۡ عِندَ ٱللَّهِ أَتۡقَىٰكُمۡۚ إِنَّ ٱللَّهَ عَلِيمٌ خَبِيرٞ","خلق الله الناس من أصل واحد وجعلهم شعوباً وقبائل ليتعارفوا، وأكرمهم عنده أتقاهم."],
[49,10,"الحجرات","إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ","المؤمنون إخوة في الدين، فالواجب الإصلاح بينهم إذا اختلفوا، وتقوى الله سبب لرحمته."],
[16,90,"النحل","۞إِنَّ ٱللَّهَ يَأۡمُرُ بِٱلۡعَدۡلِ وَٱلۡإِحۡسَٰنِ وَإِيتَآيِٕ ذِي ٱلۡقُرۡبَىٰ وَيَنۡهَىٰ عَنِ ٱلۡفَحۡشَآءِ وَٱلۡمُنكَرِ وَٱلۡبَغۡيِۚ يَعِظُكُمۡ لَعَلَّكُمۡ تَذَكَّرُونَ","يأمر الله بالعدل والإحسان وصلة الأقارب، وينهى عن كلّ قبيح وعن الظلم والتعدّي."],
[17,24,"الإسراء","وَٱخۡفِضۡ لَهُمَا جَنَاحَ ٱلذُّلِّ مِنَ ٱلرَّحۡمَةِ وَقُل رَّبِّ ٱرۡحَمۡهُمَا كَمَا رَبَّيَانِي صَغِيرٗا","يأمر الله بالتواضع للوالدين رحمة بهما، وبالدعاء لهما بالرحمة كما ربّيا ولدهما صغيراً."],
[31,17,"لقمان","يَٰبُنَيَّ أَقِمِ ٱلصَّلَوٰةَ وَأۡمُرۡ بِٱلۡمَعۡرُوفِ وَٱنۡهَ عَنِ ٱلۡمُنكَرِ وَٱصۡبِرۡ عَلَىٰ مَآ أَصَابَكَۖ إِنَّ ذَٰلِكَ مِنۡ عَزۡمِ ٱلۡأُمُورِ","من وصايا لقمان لابنه: إقامة الصلاة، والأمر بالمعروف، والنهي عن المنكر، والصبر على ما يصيبه."],
[31,18,"لقمان","وَلَا تُصَعِّرۡ خَدَّكَ لِلنَّاسِ وَلَا تَمۡشِ فِي ٱلۡأَرۡضِ مَرَحًاۖ إِنَّ ٱللَّهَ لَا يُحِبُّ كُلَّ مُخۡتَالٖ فَخُورٖ","من وصايا لقمان لابنه: لا تتكبّر على الناس ولا تمشِ مختالاً، فالله لا يحبّ المتكبّر الفخور."],
[20,114,"طه","فَتَعَٰلَى ٱللَّهُ ٱلۡمَلِكُ ٱلۡحَقُّۗ وَلَا تَعۡجَلۡ بِٱلۡقُرۡءَانِ مِن قَبۡلِ أَن يُقۡضَىٰٓ إِلَيۡكَ وَحۡيُهُۥۖ وَقُل رَّبِّ زِدۡنِي عِلۡمٗا","تنزّه الله الملك الحقّ، وأمر نبيّه ﷺ ألا يعجل بقراءة القرآن قبل تمام الوحي، وأن يسأله الزيادة من العلم."],
[96,1,"العلق","ٱقۡرَأۡ بِٱسۡمِ رَبِّكَ ٱلَّذِي خَلَقَ","أوّل ما نزل من القرآن: أمر بالقراءة مبتدئاً باسم الله الخالق."],
[103,3,"العصر","إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ","الناجون من الخسران هم الذين آمنوا وعملوا الصالحات وأوصى بعضهم بعضاً بالحقّ وبالصبر."],
[99,7,"الزلزلة","فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ","مَن يعمل وزن ذرّة من خير يجد ثوابه يوم القيامة."],
[99,8,"الزلزلة","وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ","ومَن يعمل وزن ذرّة من شرّ يجد جزاءه يوم القيامة."],
[112,1,"الإخلاص","قُلۡ هُوَ ٱللَّهُ أَحَدٌ","أمر الله نبيّه ﷺ أن يعلن أنّ الله واحد لا شريك له."],
[3,185,"آل عمران","كُلُّ نَفۡسٖ ذَآئِقَةُ ٱلۡمَوۡتِۗ وَإِنَّمَا تُوَفَّوۡنَ أُجُورَكُمۡ يَوۡمَ ٱلۡقِيَٰمَةِۖ فَمَن زُحۡزِحَ عَنِ ٱلنَّارِ وَأُدۡخِلَ ٱلۡجَنَّةَ فَقَدۡ فَازَۗ وَمَا ٱلۡحَيَوٰةُ ٱلدُّنۡيَآ إِلَّا مَتَٰعُ ٱلۡغُرُورِ","كلّ نفس ستموت، والجزاء الكامل يوم القيامة، والفوز الحقيقي هو النجاة من النار ودخول الجنّة، والدنيا متاع زائل يخدع."],
[29,69,"العنكبوت","وَٱلَّذِينَ جَٰهَدُواْ فِينَا لَنَهۡدِيَنَّهُمۡ سُبُلَنَاۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلۡمُحۡسِنِينَ","الذين يجاهدون أنفسهم في طاعة الله يهديهم إلى طرق الخير، والله مع المحسنين بعونه."],
[29,45,"العنكبوت","ٱتۡلُ مَآ أُوحِيَ إِلَيۡكَ مِنَ ٱلۡكِتَٰبِ وَأَقِمِ ٱلصَّلَوٰةَۖ إِنَّ ٱلصَّلَوٰةَ تَنۡهَىٰ عَنِ ٱلۡفَحۡشَآءِ وَٱلۡمُنكَرِۗ وَلَذِكۡرُ ٱللَّهِ أَكۡبَرُۗ وَٱللَّهُ يَعۡلَمُ مَا تَصۡنَعُونَ","أمر بتلاوة القرآن وإقامة الصلاة، فالصلاة تنهى صاحبها عن الفواحش والمنكرات، وذكر الله أعظم من كلّ شيء، والله يعلم ما يصنع العباد."],
[40,60,"غافر","وَقَالَ رَبُّكُمُ ٱدۡعُونِيٓ أَسۡتَجِبۡ لَكُمۡۚ إِنَّ ٱلَّذِينَ يَسۡتَكۡبِرُونَ عَنۡ عِبَادَتِي سَيَدۡخُلُونَ جَهَنَّمَ دَاخِرِينَ","أمر الله عباده بدعائه ووعدهم بالإجابة، وتوعّد المستكبرين عن عبادته بدخول جهنّم صاغرين."],
[2,45,"البقرة","وَٱسۡتَعِينُواْ بِٱلصَّبۡرِ وَٱلصَّلَوٰةِۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى ٱلۡخَٰشِعِينَ","الاستعانة بالصبر والصلاة تعين على الأمور كلّها، وهي ثقيلة إلا على الخاشعين."],
[2,261,"البقرة","مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمۡوَٰلَهُمۡ فِي سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتۡ سَبۡعَ سَنَابِلَ فِي كُلِّ سُنۢبُلَةٖ مِّاْئَةُ حَبَّةٖۗ وَٱللَّهُ يُضَٰعِفُ لِمَن يَشَآءُۚ وَٱللَّهُ وَٰسِعٌ عَلِيمٌ","مَثَل مَن ينفق ماله في سبيل الله كحبّة أنبتت سبع سنابل في كلّ سنبلة مئة حبّة، والله يضاعف الأجر لمن يشاء."],
[3,92,"آل عمران","لَن تَنَالُواْ ٱلۡبِرَّ حَتَّىٰ تُنفِقُواْ مِمَّا تُحِبُّونَۚ وَمَا تُنفِقُواْ مِن شَيۡءٖ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٞ","لا ينال العبد كمال البِرّ حتى ينفق ممّا يحبّ، والله عليم بكلّ ما يُنفَق."],
[3,134,"آل عمران","ٱلَّذِينَ يُنفِقُونَ فِي ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلۡكَٰظِمِينَ ٱلۡغَيۡظَ وَٱلۡعَافِينَ عَنِ ٱلنَّاسِۗ وَٱللَّهُ يُحِبُّ ٱلۡمُحۡسِنِينَ","من صفات المتّقين: الإنفاق في اليُسر والعُسر، وكتم الغيظ، والعفو عن الناس، والله يحبّ المحسنين."],
[3,139,"آل عمران","وَلَا تَهِنُواْ وَلَا تَحۡزَنُواْ وَأَنتُمُ ٱلۡأَعۡلَوۡنَ إِن كُنتُم مُّؤۡمِنِينَ","نهي للمؤمنين عن الضعف والحزن، فهم الأعلون ما داموا مؤمنين."],
[3,173,"آل عمران","ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدۡ جَمَعُواْ لَكُمۡ فَٱخۡشَوۡهُمۡ فَزَادَهُمۡ إِيمَٰنٗا وَقَالُواْ حَسۡبُنَا ٱللَّهُ وَنِعۡمَ ٱلۡوَكِيلُ","لمّا خُوِّف المؤمنون بجمع أعدائهم زادهم ذلك إيماناً وقالوا: حسبنا الله ونعم الوكيل."],
[4,86,"النساء","وَإِذَا حُيِّيتُم بِتَحِيَّةٖ فَحَيُّواْ بِأَحۡسَنَ مِنۡهَآ أَوۡ رُدُّوهَآۗ إِنَّ ٱللَّهَ كَانَ عَلَىٰ كُلِّ شَيۡءٍ حَسِيبًا","مَن حيّاكم بتحيّة فردّوا بأحسن منها أو بمثلها، فالله محاسب على كلّ شيء."],
[6,160,"الأنعام","مَن جَآءَ بِٱلۡحَسَنَةِ فَلَهُۥ عَشۡرُ أَمۡثَالِهَاۖ وَمَن جَآءَ بِٱلسَّيِّئَةِ فَلَا يُجۡزَىٰٓ إِلَّا مِثۡلَهَا وَهُمۡ لَا يُظۡلَمُونَ","من فضل الله أنّ الحسنة بعشر أمثالها، والسيئة بمثلها فقط، ولا يُظلم أحد."],
[7,199,"الأعراف","خُذِ ٱلۡعَفۡوَ وَأۡمُرۡ بِٱلۡعُرۡفِ وَأَعۡرِضۡ عَنِ ٱلۡجَٰهِلِينَ","أمر بالعفو وقبول الميسور من أخلاق الناس، وبالأمر بالمعروف، والإعراض عن الجاهلين."],
[7,55,"الأعراف","ٱدۡعُواْ رَبَّكُمۡ تَضَرُّعٗا وَخُفۡيَةًۚ إِنَّهُۥ لَا يُحِبُّ ٱلۡمُعۡتَدِينَ","أمر بدعاء الله بخشوع وفي السرّ، فالله لا يحبّ المتجاوزين الحدّ."],
[8,2,"الأنفال","إِنَّمَا ٱلۡمُؤۡمِنُونَ ٱلَّذِينَ إِذَا ذُكِرَ ٱللَّهُ وَجِلَتۡ قُلُوبُهُمۡ وَإِذَا تُلِيَتۡ عَلَيۡهِمۡ ءَايَٰتُهُۥ زَادَتۡهُمۡ إِيمَٰنٗا وَعَلَىٰ رَبِّهِمۡ يَتَوَكَّلُونَ","المؤمنون حقّاً تخشع قلوبهم عند ذكر الله، ويزداد إيمانهم بسماع آياته، وعليه وحده يعتمدون."],
[9,51,"التوبة","قُل لَّن يُصِيبَنَآ إِلَّا مَا كَتَبَ ٱللَّهُ لَنَا هُوَ مَوۡلَىٰنَاۚ وَعَلَى ٱللَّهِ فَلۡيَتَوَكَّلِ ٱلۡمُؤۡمِنُونَ","لن يصيب المؤمنَ إلا ما قدّره الله له، فهو مولاه، وعليه يتوكّل المؤمنون."],
[10,62,"يونس","أَلَآ إِنَّ أَوۡلِيَآءَ ٱللَّهِ لَا خَوۡفٌ عَلَيۡهِمۡ وَلَا هُمۡ يَحۡزَنُونَ","أولياء الله لا خوف عليهم في الآخرة، ولا يحزنون على ما فاتهم من الدنيا."],
[11,114,"هود","وَأَقِمِ ٱلصَّلَوٰةَ طَرَفَيِ ٱلنَّهَارِ وَزُلَفٗا مِّنَ ٱلَّيۡلِۚ إِنَّ ٱلۡحَسَنَٰتِ يُذۡهِبۡنَ ٱلسَّيِّـَٔاتِۚ ذَٰلِكَ ذِكۡرَىٰ لِلذَّـٰكِرِينَ","أمر بإقامة الصلاة في أوّل النهار وآخره وفي ساعات من الليل، فالحسنات تمحو السيئات، وفي ذلك عظة للمتّعظين."],
[15,9,"الحجر","إِنَّا نَحۡنُ نَزَّلۡنَا ٱلذِّكۡرَ وَإِنَّا لَهُۥ لَحَٰفِظُونَ","تكفّل الله بحفظ القرآن من التحريف والزيادة والنقص."],
[16,97,"النحل","مَنۡ عَمِلَ صَٰلِحٗا مِّن ذَكَرٍ أَوۡ أُنثَىٰ وَهُوَ مُؤۡمِنٞ فَلَنُحۡيِيَنَّهُۥ حَيَوٰةٗ طَيِّبَةٗۖ وَلَنَجۡزِيَنَّهُمۡ أَجۡرَهُم بِأَحۡسَنِ مَا كَانُواْ يَعۡمَلُونَ","مَن عمل صالحاً وهو مؤمن، ذكراً كان أو أنثى، أحياه الله حياة طيّبة في الدنيا وجزاه في الآخرة بأحسن عمله."],
[16,125,"النحل","ٱدۡعُ إِلَىٰ سَبِيلِ رَبِّكَ بِٱلۡحِكۡمَةِ وَٱلۡمَوۡعِظَةِ ٱلۡحَسَنَةِۖ وَجَٰدِلۡهُم بِٱلَّتِي هِيَ أَحۡسَنُۚ إِنَّ رَبَّكَ هُوَ أَعۡلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦ وَهُوَ أَعۡلَمُ بِٱلۡمُهۡتَدِينَ","الدعوة إلى الله تكون بالحكمة والموعظة الحسنة والجدال بالتي هي أحسن، والله أعلم بمن ضلّ وبمن اهتدى."],
[16,128,"النحل","إِنَّ ٱللَّهَ مَعَ ٱلَّذِينَ ٱتَّقَواْ وَّٱلَّذِينَ هُم مُّحۡسِنُونَ","الله مع المتّقين والمحسنين بعونه ونصره وتأييده."],

let S={screen:'home',level:0,best:{},g:null,confirmExit:false,tab:'all'};
const app=document.getElementById('app');
const shuffle=(a,r=Math.random)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bal=(a,r=Math.random)=>{
  const g={};for(const i of shuffle(a,r))(g[Q[i][0]]=g[Q[i][0]]||[]).push(i);
  const ks=shuffle(Object.keys(g).sort(),r),out=[];
  for(let n=0;out.length<a.length;n++)for(const k of ks)if(g[k][n]!=null)out.push(g[k][n]);
  return out;
};
const ids=f=>Q.map((q,i)=>i).filter(i=>f(Q[i]));
const lvOK=q=>S.level===0||q[1]===S.level;
function loadBest(){try{S.best=JSON.parse(localStorage.getItem('iq-best')||'{}')}catch(e){S.best={}}}
function saveBest(k,v){if(!(S.best[k]>=v)){S.best[k]=v;try{localStorage.setItem('iq-best',JSON.stringify(S.best))}catch(e){}}}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=s=>{let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h};

/* ---------- اللاعب: نقاط، دوريات، مهامّ ---------- */
const LG=[[0,'البرونزي'],[300,'الفضّي'],[1000,'الذهبي'],[2500,'البلاتيني'],[6000,'الماسي']];
const lgOf=xp=>{let k=0;LG.forEach((l,i)=>{if(xp>=l[0])k=i});return k};
const today=()=>new Date().toISOString().slice(0,10);
const yesterday=()=>new Date(Date.now()-864e5).toISOString().slice(0,10);
const weekOf=()=>'w'+Math.floor((Date.now()/864e5-4)/7);
const DEF={nick:'',xp:0,weekId:'',weekXp:0,weekOk:0,weekSurv:0,weekDaily:0,claimed:{},dayId:'',dayScore:0,dayMs:0,dayDone:false,streak:0,lastDay:'',bestSurvival:0,bestSprint:0,games:0,st:{}};
let P=Object.assign({},DEF);
const MISSIONS=[
  {k:'a',t:'أجب عن 40 سؤالاً إجابة صحيحة',goal:40,cur:()=>P.weekOk,xp:100},
  {k:'b',t:'ابلغ 15 إجابة صحيحة في جولة بقاء واحدة',goal:15,cur:()=>P.weekSurv,xp:100},
  {k:'c',t:'أكمل تحدّي اليوم 3 مرّات',goal:3,cur:()=>P.weekDaily,xp:150}
];
function adopt(o){
  const p=Object.assign({},DEF,o);
  for(const k in DEF){if(typeof DEF[k]==='number')p[k]=+p[k]||0;else if(typeof DEF[k]==='string')p[k]=String(p[k]||'')}
  p.nick=p.nick.slice(0,16);p.dayDone=!!p.dayDone;
  p.claimed=p.claimed&&typeof p.claimed==='object'?Object.assign({},p.claimed):{};
  const st={};if(p.st&&typeof p.st==='object')for(const k in CATS){const v=p.st[k];if(Array.isArray(v))st[k]=[+v[0]||0,+v[1]||0]}
  p.st=st;
  return p;
}
function loadP(){try{P=adopt(JSON.parse(localStorage.getItem('iq-p')||'{}'))}catch(e){P=adopt({})}}
function roll(){const w=weekOf();if(P.weekId!==w){P.weekId=w;P.weekXp=0;P.weekOk=0;P.weekSurv=0;P.weekDaily=0;P.claimed={}}}

/* ---------- الخادم: واجهة ‎/api‎ (Cloudflare Workers + D1). العنوان في config.js ---------- */
const ONLINE=true;
const API=String(window.IQ_API||'').replace(/\/+$/,'');
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const NOAPI=!API&&(NATIVE||location.protocol==='file:');
const NET={uid:null,key:null,ro:false,q:Promise.resolve(),poll:null};
const B={state:'idle',rows:[]};
async function call(method,path,body){
  if(NOAPI)throw{code:'no_api'};
  const headers={'content-type':'application/json'};
  if(NET.key)headers.authorization='Bearer '+NET.key;
  const r=await fetch(API+'/api/'+path,{method,headers,body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw{status:r.status,code:j.error||'http'};
  return j;
}
const saveLocal=()=>{try{localStorage.setItem('iq-p',JSON.stringify(P))}catch(e){}};
function setAcc(o){
  NET.uid=o?o.id:null;NET.key=o?o.key:null;
  try{o?localStorage.setItem('iq-acc',JSON.stringify(o)):localStorage.removeItem('iq-acc')}catch(e){}
}
async function signUp(pseudo,password){
  roll();
  const r=await call('POST','register',{pseudo,password,profile:P});
  setAcc({id:r.id,key:r.token});P.nick=r.pseudo;saveLocal();push();
}
async function signIn(pseudo,password){
  const r=await call('POST','login',{pseudo,password});
  setAcc({id:r.id,key:r.token});P=adopt(r.profile);P.nick=r.pseudo;roll();saveLocal();fetchBoard();
}
function signOut(){setAcc(null);P=adopt({});roll();saveLocal();G.groups=G.view=G.duels=G.duel=null}
function push(){
  if(!NET.uid)return;
  const body=JSON.parse(JSON.stringify(P));
  NET.q=NET.q.then(()=>call('PUT','players/'+NET.uid,body)).then(()=>fetchBoard()).catch(e=>{if(e&&e.status===401)setAcc(null)});
}
function persist(){saveLocal();push()}
async function connect(){
  try{const o=JSON.parse(localStorage.getItem('iq-acc')||'null');if(o&&o.id&&o.key){NET.uid=o.id;NET.key=o.key}}catch(e){}
  if(NET.uid){
    try{
      const r=await call('GET','players/'+NET.uid),o=adopt(r.profile),ahead=P.xp>o.xp;
      if(!ahead)P=o;
      P.nick=r.pseudo;roll();saveLocal();if(ahead)push();
    }catch(e){if(e&&(e.status===401||e.status===403))setAcc(null)}
  }
  loadBoard();if(['home','quests','board'].includes(S.screen))render();
}

/* ---------- اللعب ---------- */
const TIME=20,SPRINT=60;
function arm(){
  const g=S.g,nq=Q[g.queue[g.i]][3].length;g.order=shuffle([...Array(nq).keys()]);g.picked=null;g.ok=false;g.t=TIME;g.t0=Date.now();
  if(g.mode==='tf')g.prop=Math.random()<.5?0:1+Math.floor(Math.random()*(nq-1));
}
const game=o=>Object.assign({i:0,score:0,xp:0,log:[]},o);
function startClassic(cat){
  S.g=game({mode:'classic',cat,queue:shuffle(ids(x=>x[0]===cat&&lvOK(x))).slice(0,10)});arm();S.screen='play';
}
function startSurvival(){
  const by=d=>bal(ids(x=>x[1]===d));
  const e=by(1),m=by(2),h=by(3);
  S.g=game({mode:'survival',lives:3,queue:[...e.slice(0,5),...m.slice(0,7),...h,...bal([...e.slice(5),...m.slice(7)])]});arm();S.screen='play';
}
function startSprint(){S.g=game({mode:'sprint',T:SPRINT,queue:bal(ids(lvOK))});arm();S.screen='play'}
function startTF(){S.g=game({mode:'tf',queue:bal(ids(lvOK)).slice(0,15)});arm();S.screen='play'}
function startDuel(n1,n2){
  const all=bal(ids(lvOK));
  S.g=game({mode:'duel',names:[n1,n2],queue:all.slice(0,10),extra:all.slice(10,16),scores:[0,0],tb:0});arm();S.screen='play';
}
function seeded(seed){
  const r=rng(hash(String(seed))),by=d=>bal(ids(x=>x[1]===d),r);
  return [...by(1).slice(0,4),...by(2).slice(0,4),...by(3).slice(0,2)];
}
function startRemote(code,seed){S.g=game({mode:'rduel',code,ms:0,queue:seeded(seed)});arm();S.screen='play'}
function startDaily(){
  roll();if(P.dayId===today())return;
  S.g=game({mode:'daily',ms:0,queue:seeded(today())});
  P.dayId=today();P.dayScore=0;P.dayMs=0;P.dayDone=false;persist();
  arm();S.screen='play';
}
function pick(k){
  const g=S.g;if(g.picked!==null)return;
  g.picked=k;const q=Q[g.queue[g.i]];
  const ok=k>=0&&(g.mode==='tf'?(k===0)===(g.prop===0):g.order[k]===0);
  g.ok=ok;g.log.push({id:g.queue[g.i],ok});
  if(g.mode==='daily'||g.mode==='rduel')g.ms+=Date.now()-g.t0;
  if(g.mode==='duel'){if(ok)g.scores[g.i%2]++;return}
  if(ok){g.score++;g.xp+=(g.mode==='tf'?5:10)*q[1]}
  else if(g.mode==='survival')g.lives--;
  else if(g.mode==='sprint')g.T=Math.max(0,g.T-3);
  if(g.mode==='sprint')setTimeout(()=>{if(S.g===g&&S.screen==='play'&&g.picked!==null){next();render()}},450);
}
function next(){
  const g=S.g;g.i++;
  let over=g.i>=g.queue.length;
  if(g.mode==='survival'&&g.lives<=0)over=true;
  if(g.mode==='sprint'&&g.T<=0)over=true;
  if(g.mode==='duel'&&over&&g.scores[0]===g.scores[1]&&g.extra.length>=2){g.queue.push(g.extra.shift(),g.extra.shift());g.tb++;over=false}
  if(over)finish();else arm();
}
function finish(){
  const g=S.g;S.screen='end';
  if(g.mode==='duel')return;
  roll();
  let gain=g.xp;
  if(g.mode==='classic')saveBest('c-'+g.cat+'-'+S.level,g.score);
  if(g.mode==='survival'){g.rec=g.score>P.bestSurvival;P.bestSurvival=Math.max(P.bestSurvival,g.score);P.weekSurv=Math.max(P.weekSurv,g.score)}
  if(g.mode==='sprint'){g.rec=g.score>P.bestSprint;P.bestSprint=Math.max(P.bestSprint,g.score)}
  if(g.mode==='daily'){
    gain+=50;P.dayScore=g.score;P.dayMs=g.ms;P.dayDone=true;P.weekDaily++;
    if(P.lastDay!==today())P.streak=P.lastDay===yesterday()?P.streak+1:1;
    P.lastDay=today();
  }
  g.gain=gain;g.lg0=lgOf(P.xp);P.games++;
  for(const l of g.log){const c=Q[l.id][0],a=P.st[c]||(P.st[c]=[0,0]);a[1]++;if(l.ok)a[0]++}
  if(g.mode==='rduel'){G.duel=null;sendDuel(g)}
  P.xp+=gain;P.weekXp+=gain;P.weekOk+=g.log.filter(l=>l.ok).length;
  g.lg1=lgOf(P.xp);
  persist();
}

    ${MISSIONS.map(m=>{const c=Math.min(m.goal,m.cur()),done=c>=m.goal,got=P.claimed[m.k];
      return `<div class="row"><p>${m.t}</p>${got?`<span class="tag ok">تمّ · +${m.xp}</span>`:done?`<button class="claim" data-act="claim" data-v="${m.k}">استلم +${m.xp}</button>`:`<span class="tag">${fr(c,m.goal)}</span>`}</div>
      <div class="track"><div style="width:${c/m.goal*100}%"></div></div>`}).join('')}
    <p class="hint">تتجدّد المهامّ ونقاط الأسبوع كلّ يوم اثنين.</p>
  </section>`;
}
function rankPanel(){
  const me={id:NET.uid||'me',nick:P.nick||'أنت',xp:P.xp};
  const list=B.rows.filter(r=>r.id!==me.id&&(r.games>0||r.xp>0||r.dayDone)).concat([me]).sort((a,b)=>b.xp-a.xp);
  const mine=list.findIndex(r=>r.id===me.id),shown=list.slice(0,5).map((r,i)=>[r,i]);
  if(mine>=5)shown.push([list[mine],mine]);
  const note={off:'لم يُضبط عنوان الخادم بعد.',idle:'جارٍ تحميل الترتيب…',loading:'جارٍ تحميل الترتيب…',slow:'تعذّر الوصول إلى الترتيب حتى الآن.',err:'تعذّر تحميل الترتيب.'}[B.state]||'';
  return `<section class="panel">
    <div class="row"><h3>الترتيب${B.state==='ok'?` · ${list.length} لاعباً`:''}</h3><button class="claim" data-act="go" data-v="board">عرض الكل</button></div>
    <div class="rank">${shown.map(([r,i])=>`<div class="rk${r.id===me.id?' mine':''}${i<3?' top':''}"><span class="n">${i+1}</span>${star('','sm',lgOf(r.xp))}<span class="nm">${esc(r.nick)}</span><span class="v">${r.xp} نقطة</span></div>`).join('')}</div>
    ${note?`<p class="hint">${note}</p>`:''}
  </section>`;
}
function vBoard(){
  roll();
  const me={id:NET.uid||'me',nick:P.nick||'أنت',xp:P.xp,weekId:P.weekId,weekXp:P.weekXp,dayId:P.dayId,dayScore:P.dayScore,dayMs:P.dayMs,dayDone:P.dayDone};
  const rows=B.rows.filter(r=>r.id!==me.id&&(r.games>0||r.xp>0||r.dayDone)).concat([me]),wk=weekOf(),td=today(),L=lgOf(P.xp),t=S.tab;
  if(t==='groups')return `
  <div class="bar"><h2 class="title">الترتيب</h2></div>
  ${segHtml(t)}
  ${groupsView()}
  ${nav('board')}`;
  let list,val,empty='';
  if(t==='league'){list=rows.filter(r=>lgOf(r.xp)===L&&r.weekId===wk).sort((a,b)=>b.weekXp-a.weekXp);val=r=>r.weekXp+' نقطة'}
  else if(t==='day'){list=rows.filter(r=>r.dayId===td&&r.dayDone).sort((a,b)=>b.dayScore-a.dayScore||a.dayMs-b.dayMs);val=r=>`${fr(r.dayScore,10)} · ${clock(r.dayMs)}`;empty='لم يُكمل أحدٌ تحدّي اليوم بعد.'}
  else{list=rows.slice().sort((a,b)=>b.xp-a.xp);val=r=>r.xp+' نقطة'}
  const shown=list.map((r,i)=>[r,i]);
  const note={off:'لم يُضبط عنوان الخادم في ملفّ config.js، فالترتيب المشترك غير متاح.',loading:'جارٍ تحميل الترتيب…',slow:'تعذّر الوصول إلى الترتيب حتى الآن، وما زالت المحاولة جارية.',err:'تعذّر تحميل الترتيب. اضغط «تحديث» للمحاولة من جديد.'}[B.state]
    ||'';
  return `
  <div class="bar"><h2 class="title">الترتيب</h2>${B.state==='err'?`<button class="back" data-act="refresh">تحديث</button>`:B.state==='ok'?`<span class="tag ok">مباشر · ${rows.length} لاعباً</span>`:''}</div>
  ${segHtml(t)}
  ${t==='league'?`<p class="hint">الدوري ${LG[L][1]}: لاعبو هذا الدوري مرتّبون بنقاط الأسبوع الجاري.</p>`:''}
  ${note?`<p class="hint">${note}</p>`:''}
  ${ONLINE?(!NET.uid?`<button class="go ghost" data-act="go" data-v="name">أنشئ حساباً لتظهر في الترتيب</button>`:''):(!P.nick?`<button class="go ghost" data-act="go" data-v="name">اختر اسمك ليظهر في الترتيب</button>`:'')}
  <div class="rank">
    ${shown.length?shown.map(([r,i])=>`<div class="rk${r.id===me.id?' mine':''}${i<3?' top':''}"><span class="n">${i+1}</span>${star('','sm',lgOf(r.xp))}<span class="nm">${esc(r.nick)}</span><span class="v">${val(r)}</span></div>`).join(''):`<p class="hint">${empty}</p>`}
  </div>
  ${nav('board')}`;
}
function vPlay(){
  const g=S.g,q=Q[g.queue[g.i]],done=g.picked!==null,L=['أ','ب','ج','د'],ok=g.ok;
  let hud='',sub='';
  if(g.mode==='classic'||g.mode==='tf'||g.mode==='daily'||g.mode==='rduel'){
    hud=`<span class="hud">${g.mode==='daily'?'تحدّي اليوم · ':g.mode==='rduel'?'مبارزة بالرمز · ':''}${fr(g.i+1,g.queue.length)}</span>`;
    sub=`<div class="track"><div style="width:${(g.i+(done?1:0))/g.queue.length*100}%"></div></div>`;
  }else if(g.mode==='survival'){
    hud=`<span class="hud"><span class="lives" aria-label="المحاولات المتبقية: ${g.lives}">${[1,2,3].map(n=>star('','sm'+(n>g.lives?' off':''))).join('')}</span>النتيجة ${g.score}</span>`;
    sub=`<div class="track${g.t<=5?' hot':''}" id="timer"><div style="width:${g.t/TIME*100}%"></div></div>`;
  }else if(g.mode==='sprint'){
    hud=`<span class="hud">النتيجة ${g.score} · <span id="secs">${Math.ceil(g.T)}</span> ث</span>`;
    sub=`<div class="track${g.T<=10?' hot':''}" id="timer"><div style="width:${g.T/SPRINT*100}%"></div></div>`;
  }else{
    const turn=g.i%2;
    hud=`<span class="hud">${g.tb&&g.i>=10?'جولة فاصلة':`الجولة ${fr(Math.floor(g.i/2)+1,5)}`}</span>`;
    sub=`<div class="duo">${g.names.map((n,k)=>`<div class="pl${k===turn?' on':''}"><span>${esc(n)}</span><b>${g.scores[k]}</b></div>`).join('')}</div>`;
  }
  const last=g.i+1>=g.queue.length||(g.mode==='survival'&&g.lives<=0);
  const more=g.mode==='duel'&&g.scores[0]===g.scores[1]&&g.extra.length>=2;
  let opts;
  if(g.mode==='tf'){
    const truth=g.prop===0?0:1;
    opts=`<div class="opts two">${['صحيح','خطأ'].map((l,k)=>`<button class="opt big${done&&k===truth?' ok':done&&k===g.picked?' no':''}" data-act="pick" data-v="${k}" ${done?'disabled':''}>${l}</button>`).join('')}</div>`;
  }else{
    opts=`<div class="opts">${g.order.map((o,k)=>`<button class="opt${done&&o===0?' ok':done&&k===g.picked?' no':''}" data-act="pick" data-v="${k}" ${done?'disabled':''}>${star(L[k])}<span>${q[3][o]}</span></button>`).join('')}</div>`;
  }
  const exitLabel=S.confirmExit?(g.mode==='daily'||g.mode==='rduel'?'تُحتسب المحاولة. تأكيد؟':'تأكيد الخروج؟'):'خروج';
  return `
  <div class="bar">${hud}<button class="back${S.confirmExit?' warn':''}" data-act="exit">${exitLabel}</button></div>
  ${sub}
  <section class="qcard">
    <div class="meta"><span>${CATS[q[0]].n}</span><span>${LV[q[1]]}${dots(q[1])}</span></div>
    <h2>${q[2]}</h2>
    ${g.mode==='tf'?`<div class="prop"><span>الجواب المقترح</span><b>${q[3][g.prop]}</b></div>`:''}
  </section>
  ${opts}
  ${done&&g.mode!=='sprint'?`<div class="note${ok?'':' bad'}"><b>${ok?'إجابة صحيحة':g.picked<0?'انتهى الوقت':'إجابة خاطئة'}</b>${g.mode==='tf'&&g.prop!==0?`الجواب الصحيح: ${q[3][0]}. `:''}${q[4]}</div>
  <button class="go" data-act="next" id="next">${last&&!more?'النتيجة':'التالي'}</button>`:''}`;
}
function vEnd(){
  const g=S.g;let head='',again=`<button class="go" data-act="again">العب مرّة أخرى</button>`;
  const gain=g.gain?`<p class="gain">+${g.gain} نقطة${g.lg1>g.lg0?` · صعدتَ إلى الدوري ${LG[g.lg1][1]}`:''}</p>`:'';
  if(g.mode==='duel'){
    const [a,b]=g.scores,w=a===b?null:g.names[a>b?0:1];
    head=`<div class="result"><div class="big">${a}<small> – </small>${b}</div><h2>${w?`الفائز: ${esc(w)}`:'تعادل'}</h2><p>${esc(g.names[0])} ضدّ ${esc(g.names[1])}</p></div>`;
  }else if(g.mode==='rduel'){
    const d=G.duel,op=d&&d[d.you==='a'?'b':'a'];
    const line=!d?'جارٍ إرسال النتيجة…':op&&op.done?`${esc(op.nick)}: ${fr(op.score,10)} · ${clock(op.ms)}`:'أرسل هذا الرمز إلى خصمك ليلعب الأسئلة نفسها.';
    head=`<div class="result"><div class="big" dir="ltr">${g.score}<small> / ${g.queue.length}</small></div><h2>${d?verdict(d):'مبارزة بالرمز'}</h2><p class="code" dir="ltr">${esc(g.code)}</p><p>${line}</p><p class="hint">وقتك: ${clock(g.ms)}</p>${gain}</div>`;
    again=`<button class="go" data-act="rd-refresh">تحديث النتيجة</button>`;
  }else if(g.mode==='survival'||g.mode==='sprint'){
    const best=g.mode==='survival'?P.bestSurvival:P.bestSprint;
    const h=g.mode==='sprint'?'انتهى الوقت':g.lives>0?'أجبت عن كلّ الأسئلة':'انتهت المحاولات';
    head=`<div class="result"><div class="big">${g.score}</div><h2>${h}</h2><p>${g.rec?'هذه أفضل نتيجة لك حتى الآن.':`أفضل نتيجة لك: ${best}`}</p>${gain}</div>`;
  }else{
    const n=g.queue.length,r=g.score/n;
    const sub=g.mode==='daily'?`تحدّي اليوم · ${clock(g.ms)}`:g.mode==='tf'?`صحيح أم خطأ · ${LV[S.level]}`:`${CATS[g.cat].n} · ${LV[S.level]}`;
    head=`<div class="result"><div class="big" dir="ltr">${g.score}<small> / ${n}</small></div><h2>${r>=.8?'ما شاء الله، أداء ممتاز':r>=.5?'أحسنت، واصل المراجعة':'راجع وحاول من جديد'}</h2><p>${sub}</p>${gain}</div>`;
    if(g.mode==='daily')again=`<button class="go" data-act="tab" data-v="day">ترتيب اليوم</button>`;
  }
  const wrong=g.log.filter(l=>!l.ok);
  return `${head}
  <div class="acts">${again}<button class="go ghost" data-act="go" data-v="home">الصفحة الرئيسية</button></div>
  ${wrong.length?`<section class="review"><h3>للمراجعة (${wrong.length})</h3>${wrong.map(l=>{const q=Q[l.id];return `<div class="rv"><b>${q[2]}</b><span>${q[3][0]}</span><small>${q[4]}</small></div>`}).join('')}</section>`:''}`;
}
const VIEWS={home:vHome,cats:vCats,duel:vDuel,rduel:vRduel,name:vName,quests:vQuests,board:vBoard,play:vPlay,end:vEnd};
function render(){
  app.innerHTML=VIEWS[S.screen]();
  app.classList.toggle('solo',!['home','quests','board'].includes(S.screen));
  if(S.screen==='play'&&S.g.picked!==null){const n=document.getElementById('next');n&&n.scrollIntoView({block:'nearest'})}
  else if(S.screen!==render.last||S.screen==='play')window.scrollTo(0,0);
  render.last=S.screen;
}

/* ---------- الأحداث ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a!=='exit')S.confirmExit=false;
  if(a==='level')S.level=+v;
  else if(a==='go'){S.screen=v;S.err='';if(v==='board')loadBoard();if(v==='rduel'&&ONLINE&&NET.uid)run(loadDuels);if(v==='board'&&S.tab==='groups'&&ONLINE&&NET.uid)run(loadGroups)}
  else if(a==='tab'){S.tab=v;S.err='';if(S.screen!=='board'){S.screen='board';loadBoard()}if(v==='groups'&&NET.uid){G.view=null;run(loadGroups)}}
  else if(a==='acc'){S.acc=v;S.err=''}
  else if(a==='logout')signOut();
  else if(a==='rd-new')run(async()=>{const d=await call('POST','duels');startRemote(d.code,d.seed)});
  else if(a==='rd-refresh')run(async()=>{G.duel=await call('GET','duels/'+S.g.code)});
  else if(a==='g-open')run(async()=>{G.view=await call('GET','groups/'+v)});
  else if(a==='g-back'){G.view=null;run(loadGroups)}
  else if(a==='g-leave')run(async()=>{await call('POST','groups/'+G.view.code+'/leave');G.view=null;await loadGroups()});
  else if(a==='refresh')loadBoard();
  else if(a==='classic')startClassic(v);
  else if(a==='survival')startSurvival();
  else if(a==='sprint')startSprint();
  else if(a==='tf')startTF();
  else if(a==='daily')startDaily();
  else if(a==='pick')pick(+v);
  else if(a==='next')next();
  else if(a==='claim'){const m=MISSIONS.find(x=>x.k===v);if(m&&m.cur()>=m.goal&&!P.claimed[v]){P.claimed[v]=1;P.xp+=m.xp;P.weekXp+=m.xp;persist()}}
  else if(a==='exit'){
    if(!S.confirmExit)S.confirmExit=true;
    else{S.confirmExit=false;if(S.g.mode==='daily'||S.g.mode==='rduel')finish();else S.screen='home'}
  }
  else if(a==='again'){const g=S.g;({classic:()=>startClassic(g.cat),survival:startSurvival,sprint:startSprint,tf:startTF,duel:()=>startDuel(...g.names)}[g.mode]||(()=>{S.screen='home'}))()}
  render();
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  const n=id=>document.getElementById(id).value.trim().slice(0,16);
  const id=e.target.id,code=k=>n(k).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(id==='name-form'){P.nick=n('nick');persist();S.screen='home'}
  else if(id==='acc-form'){
    const ps=n('pseudo'),pw=document.getElementById('pass').value;S.fp=ps;
    run(async()=>{await (S.acc==='register'?signUp(ps,pw):signIn(ps,pw));S.fp='';S.screen='home'});return;
  }
  else if(id==='duel-join'){
    const c=code('dcode');
    run(async()=>{
      const d=await call('GET','duels/'+c);
      if(d.you&&d[d.you].done)throw{code:'done'};
      if(!d.you&&d.b)throw{code:'full'};
      startRemote(d.code,d.seed);
    });return;
  }
  else if(id==='group-create'){const nm=document.getElementById('gname').value.trim();run(async()=>{const g=await call('POST','groups',{name:nm});G.view=await call('GET','groups/'+g.code)});return}
  else if(id==='group-join'){const c=code('gcode');run(async()=>{await call('POST','groups/'+c+'/join');G.view=await call('GET','groups/'+c)});return}
  else startDuel(n('p1')||'اللاعب الأوّل',n('p2')||'اللاعب الثاني');
  render();
});
setInterval(()=>{
  const g=S.g;
  if(S.screen!=='play'||!g||g.picked!==null)return;
  let f,hot;
  if(g.mode==='survival'){g.t=Math.max(0,g.t-.1);if(g.t<=0){pick(-1);render();return}f=g.t/TIME;hot=g.t<=5}
  else if(g.mode==='sprint'){g.T=Math.max(0,g.T-.1);if(g.T<=0){finish();render();return}f=g.T/SPRINT;hot=g.T<=10;const s=document.getElementById('secs');if(s)s.textContent=Math.ceil(g.T)}
  else return;
  const t=document.getElementById('timer');
  if(t){t.firstElementChild.style.width=f*100+'%';t.classList.toggle('hot',hot)}
},100);

/* ---------- زخرفة الخلفية: شبكة نجوم ثمانية ---------- */
function lattice(){
  const c=document.getElementById('lattice'),r=window.devicePixelRatio||1,w=innerWidth,h=innerHeight;
  c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);
  x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');x.globalAlpha=.32;x.lineWidth=1;
  const s=72,a=s*.36;
  for(let cy=0;cy<h+s;cy+=s)for(let cx=0;cx<w+s;cx+=s){
    x.strokeRect(cx-a,cy-a,2*a,2*a);
    x.save();x.translate(cx,cy);x.rotate(Math.PI/4);x.strokeRect(-a,-a,2*a,2*a);x.restore();
  }
}
addEventListener('resize',lattice);

function start(data){
  loadBest();loadP();roll();
  if(data&&data.screen&&VIEWS[data.screen]){const best=S.best;S=Object.assign(S,data);S.best=Object.assign({},data.best,best)}
  if(S.screen==='play'&&S.g&&S.g.mode==='sprint'&&S.g.picked!==null)next();
  lattice();render();connect();
}
const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
if(CapApp&&CapApp.addListener)CapApp.addListener('backButton',()=>{
  if(S.screen==='home'){CapApp.exitApp();return}
  if(S.screen==='play'){const b=app.querySelector('[data-act=exit]');if(b)b.click();return}
  S.screen='home';render();
});
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

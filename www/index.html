<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نِبراس — IslamQuizz</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0c3533">
<style>
/* Amiri est servie depuis fonts/ : le texte coranique (rasm othmani) dépend de cette police. */
@font-face{font-family:"Amiri";font-weight:400;font-display:swap;src:url(fonts/amiri-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Amiri";font-weight:700;font-display:swap;src:url(fonts/amiri-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+2010-2011,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:"Amiri";font-weight:400;font-display:swap;src:url(fonts/amiri-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2013-2014,U+2018-201D,U+2026}
@font-face{font-family:"Amiri";font-weight:700;font-display:swap;src:url(fonts/amiri-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2013-2014,U+2018-201D,U+2026}
/* Layout idea: one phone-width column on a zellige-green night; ivory "tile" cards; brass only for what the player acts on. Single theme by choice. */
:root{
  color-scheme: dark;
  --night:#0c3533;      /* zellige green, page ground */
  --night-2:#124643;    /* raised ground */
  --line:#2b6a64;       /* lattice + hairlines */
  --tile:#f3eee1;       /* ivory card */
  --ink:#16302e;        /* text on ivory */
  --mist:#b9d2cc;       /* text on green */
  --brass:#d2ab55;      /* accent */
  --good:#2f8a58;
  --good-soft:#9fdcb9;
  --bad:#b5463c;
  --bad-soft:#f0b9b2;
  /* league metals */
  --lg0:#bd8355; --lg1:#c3cdd0; --lg2:#d2ab55; --lg3:#7ed3c5; --lg4:#9dbcff;
  --f-display:"Amiri","Scheherazade New","Traditional Arabic","Geeza Pro","Times New Roman",serif;
  --f-body:"Amiri","Scheherazade New","Traditional Arabic","Geeza Pro","Times New Roman",serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--night);color:var(--mist);font-family:var(--f-body);font-size:20px;line-height:1.65;-webkit-tap-highlight-color:transparent}
#lattice{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#app{position:relative;max-width:460px;min-height:100%;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 0;display:flex;flex-direction:column;gap:16px}
#app.solo{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
h1,h2,h3,.disp{font-family:var(--f-display);text-wrap:balance}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:2.7rem;line-height:1.2;color:var(--tile);font-weight:700}
.brand span{color:var(--brass)}
.me{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding-block:3px;padding-inline:6px 16px;font-family:var(--f-display);text-align:start;max-width:60%}
.me span{min-width:0}
.me b{display:block;color:var(--tile);font-size:.95rem;line-height:1.3;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{display:block;font-size:.85rem;line-height:1.2;font-variant-numeric:tabular-nums}
.daily{background:var(--brass);color:var(--ink);border-radius:6px 26px 6px 26px;padding:14px 18px 16px;text-align:start;display:flex;flex-direction:column;gap:2px;width:100%}
.daily .k{font-family:var(--f-display);font-size:.88rem;opacity:.8}
.daily b{font-family:var(--f-display);font-size:1.55rem;line-height:1.3}
.daily small{font-size:.92rem;line-height:1.5}
.daily.done{background:var(--night-2);color:var(--mist);border:1.5px solid var(--brass)}
.daily.done b{color:var(--tile)}
.aya{background:var(--night-2);border:1.5px solid var(--line);border-radius:26px 6px 26px 6px;padding:12px 18px 14px;display:flex;flex-direction:column;gap:4px}
.aya .k{font-family:var(--f-display);font-size:.88rem;color:var(--brass)}
.aya blockquote{font-family:var(--f-display);font-size:1.35rem;line-height:1.9;color:var(--tile);text-wrap:pretty}
.aya cite{font-style:normal;font-family:var(--f-display);font-size:.85rem;color:var(--brass)}
.aya p{font-size:.95rem;line-height:1.6;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.levels{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.levels .lab{font-family:var(--f-display);font-size:.95rem;margin-inline-end:4px}
.chip{padding:4px 16px;border-radius:999px;border:1.5px solid var(--line);font-family:var(--f-display);font-size:.95rem;color:var(--mist)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:2px;text-align:start;background:var(--tile);color:var(--ink);padding:12px 16px 14px;border-radius:6px 20px 6px 20px;transition:transform .12s}
.mode:active{transform:scale(.98)}
.mode.wide{grid-column:span 2}
.mode b{font-family:var(--f-display);font-size:1.3rem;line-height:1.35}
.mode small{font-size:.88rem;line-height:1.45;opacity:.8}
.mode .best{font-family:var(--f-display);font-size:.88rem;color:var(--good)}
.tabbar{position:sticky;bottom:0;margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--night);padding:10px 0 calc(12px + env(safe-area-inset-bottom));border-top:1.5px solid var(--line)}
.tabbar button{font-family:var(--f-display);font-size:.95rem;padding:5px;border-radius:999px;color:var(--mist)}
.tabbar button[aria-current="page"]{background:var(--night-2);color:var(--brass)}

/* eight-point star medallion */
.star{width:46px;height:46px;display:grid;place-items:center;position:relative;font-family:var(--f-display);font-weight:700;color:var(--ink);flex:none}
.star::before,.star::after{content:"";position:absolute;inset:5px;background:var(--sc,var(--brass));border-radius:3px}
.star::after{transform:rotate(45deg)}
.star i{position:relative;z-index:1;font-style:normal;font-size:1.05rem;line-height:1}
.star.sm{width:26px;height:26px}
.star.sm::before,.star.sm::after{inset:4px;border-radius:2px}
.star.off{--sc:var(--line)}

/* sub screens */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.back{font-family:var(--f-display);font-size:.95rem;padding:4px 14px;border:1.5px solid var(--line);border-radius:999px;white-space:nowrap}
.back.warn{border-color:var(--bad);color:var(--bad-soft)}
.title{font-size:1.9rem;color:var(--tile);line-height:1.3}
.cats{display:flex;flex-direction:column;gap:10px}
.cat{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:start;background:var(--night-2);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px}
.cat b{font-family:var(--f-display);font-size:1.25rem;color:var(--tile);display:block;line-height:1.4}
.cat small{font-size:.9rem}
.cat em{font-style:normal;font-family:var(--f-display);font-size:.85rem;color:var(--brass);white-space:nowrap}
form.setup{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--f-display);font-size:.95rem}
.field input{background:var(--tile);color:var(--ink);border:0;border-radius:10px;padding:10px 14px;font-size:1.1rem}
.go{background:var(--brass);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:1.2rem;padding:12px 20px;border-radius:999px;width:100%}
.go.ghost{background:none;color:var(--mist);border:1.5px solid var(--line);font-weight:700}
.hint{font-size:.9rem;line-height:1.6;opacity:.85}

/* challenges */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--night-2);border-radius:14px;padding:10px 8px;text-align:center;font-family:var(--f-display);font-size:.88rem;line-height:1.4}
.stat b{display:block;font-size:1.5rem;color:var(--tile);font-variant-numeric:tabular-nums;line-height:1.3}
.panel{background:var(--night-2);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
.panel h3{color:var(--tile);font-size:1.1rem;font-weight:700;line-height:1.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row p{font-size:.98rem;line-height:1.5}
.tag{font-family:var(--f-display);font-size:.85rem;color:var(--brass);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag.ok{color:var(--good-soft)}
.claim{background:var(--brass);color:var(--ink);font-family:var(--f-display);font-size:.9rem;padding:3px 14px;border-radius:999px;white-space:nowrap}
.track{height:6px;border-radius:3px;background:var(--night-2);overflow:hidden}
.panel .track{background:var(--night)}
.track div{height:100%;background:var(--brass);border-radius:3px;transition:width .1s linear}
.track.hot div{background:var(--bad)}

/* ranking */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg .chip{padding-inline:4px;text-align:center}
.rank{display:flex;flex-direction:column;gap:6px}
.rk{display:grid;grid-template-columns:1.8em auto 1fr auto;gap:10px;align-items:center;background:var(--night-2);border-radius:12px;padding:5px 12px;font-family:var(--f-display)}
.rk .n{font-variant-numeric:tabular-nums;opacity:.7;text-align:center}
.rk .nm{color:var(--tile);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .v{font-variant-numeric:tabular-nums;color:var(--brass);font-size:.9rem;white-space:nowrap}
.rk.mine{outline:1.5px solid var(--brass)}
.panel .rk{background:var(--night)}
.rk.top .n{color:var(--brass);opacity:1;font-weight:700}

/* play */
.hud{font-family:var(--f-display);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.lives{display:flex;gap:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);gap:8px}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl b{font-size:1.3rem;font-variant-numeric:tabular-nums}
.pl.on{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.qcard{background:var(--tile);color:var(--ink);border-radius:6px 26px 6px 26px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:.85rem;opacity:.75}
.dots{display:inline-flex;gap:3px;margin-inline-start:6px;vertical-align:middle}
.dots i{width:7px;height:7px;transform:rotate(45deg);background:currentColor;opacity:.25}
.dots i.f{opacity:1}
.qcard h2{overflow-wrap:anywhere;font-family:var(--f-body);font-weight:700;font-size:1.4rem;line-height:1.75}
.prop{border-top:1.5px dashed color-mix(in srgb,var(--ink) 30%,transparent);padding-top:10px}
.prop span{display:block;font-family:var(--f-display);font-size:.88rem;opacity:.7}
.prop b{font-size:1.25rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:start;background:var(--night-2);border:1.5px solid var(--line);border-radius:14px;padding:8px 12px;color:var(--tile);font-weight:700;min-height:58px;line-height:1.6}
.opt.big{justify-content:center;font-family:var(--f-display);font-size:1.25rem;min-height:68px}
.opt:disabled{cursor:default;opacity:.55}
.opt.ok{background:var(--good);border-color:var(--good);opacity:1}
.opt.no{background:var(--bad);border-color:var(--bad);opacity:1}
.opt.ok .star,.opt.no .star{--sc:var(--tile)}
.note{border-inline-start:3px solid var(--brass);padding:2px 12px;font-size:.98rem}
.note b{font-family:var(--f-display);color:var(--tile);display:block}
.note.bad b{color:var(--bad-soft)}

/* end */
.result{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-top:10px}
.result .big{font-family:var(--f-display);font-weight:700;font-size:4.5rem;line-height:1.1;color:var(--brass);font-variant-numeric:tabular-nums}
.result .big small{font-size:1.6rem;color:var(--mist);font-weight:700}
.result h2{font-size:1.7rem;color:var(--tile)}
.gain{font-family:var(--f-display);color:var(--good-soft)}
.review{display:flex;flex-direction:column;gap:10px}
.review h3{font-size:1.05rem;color:var(--tile);font-weight:700}
.rv{background:var(--night-2);border-radius:12px;padding:10px 14px;font-size:.98rem}
.rv b{display:block;color:var(--tile)}
.rv span{color:var(--good-soft)}
.rv small{display:block;opacity:.8;font-size:.88rem}
.acts{display:flex;flex-direction:column;gap:10px}
.err{color:var(--bad-soft);font-size:.95rem;line-height:1.5}
.code{font-family:var(--f-display);font-size:2.2rem;letter-spacing:.18em;color:var(--brass);font-weight:700;line-height:1.3}
.seg.two,.seg.four{grid-template-columns:1fr 1fr}
.go:disabled{opacity:.6}
.field input[dir="ltr"]{letter-spacing:.12em;text-align:center;text-transform:uppercase}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

   [الباب, المستوى 1-3, السؤال, [الجواب الصحيح أولاً, ثم ثلاثة خاطئة], المرجع] */
const CATS={

  p:{n:'الصحابة والأعلام',s:'أنبياء وصحابة وقادة وعلماء'},
  f:{n:'الفقه والعبادات',s:'صلاة وزكاة وصيام وحج'},
  n:{n:'قصص الأنبياء',s:'من آدم إلى عيسى عليهم السلام'},
  t:{n:'التاريخ والحضارة',s:'دول وفتوحات وعلماء ومعالم'},
  a:{n:'العقيدة والآداب',s:'إيمان وغيب وأذكار وأخلاق'}
};
const LV=['الكل','سهل','متوسط','صعب'];
const Q=[
/* القرآن */
['q',1,'كم عدد سور القرآن الكريم؟',['114 سورة','110 سور','120 سورة','99 سورة'],'المصحف الشريف: من الفاتحة إلى الناس'],
['q',1,'ما أطول سورة في القرآن الكريم؟',['البقرة','آل عمران','النساء','الأعراف'],'سورة البقرة: 286 آية'],
['q',1,'ما أقصر سورة في القرآن الكريم؟',['الكوثر','الإخلاص','العصر','النصر'],'سورة الكوثر: 3 آيات'],
['q',1,'ما السورة التي تُسمّى «أمّ الكتاب»؟',['الفاتحة','البقرة','يس','الإخلاص'],'من أسماء الفاتحة: أمّ الكتاب، وأمّ القرآن، والسبع المثاني'],
['q',1,'في أيّ شهر أُنزل القرآن الكريم؟',['رمضان','شعبان','رجب','ذو الحجة'],'سورة البقرة، الآية 185'],
['q',1,'كم عدد أجزاء القرآن الكريم؟',['30 جزءاً','60 جزءاً','20 جزءاً','114 جزءاً'],'يُقسَّم المصحف إلى 30 جزءاً و60 حزباً'],
['q',1,'ما أوّل ما نزل من القرآن الكريم؟',['صدر سورة العلق','سورة الفاتحة','سورة البقرة','سورة الناس'],'حديث عائشة في بدء الوحي، متفق عليه'],
['q',1,'في كم سنة تقريباً نزل القرآن على النبي ﷺ؟',['23 سنة','10 سنوات','13 سنة','40 سنة'],'13 سنة بمكة و10 سنوات بالمدينة'],
['q',2,'ما السورة التي لا تبدأ بالبسملة؟',['التوبة','الأنفال','النمل','الملك'],'سورة التوبة (براءة)'],
['q',2,'ما السورة التي وردت فيها البسملة مرّتين؟',['النمل','التوبة','هود','الفاتحة'],'سورة النمل، الآية 30'],
['q',2,'أيّ نبيّ وُصفت قصّته في القرآن بأنها «أحسن القصص»؟',['يوسف عليه السلام','موسى عليه السلام','إبراهيم عليه السلام','نوح عليه السلام'],'سورة يوسف، الآية 3'],
['q',2,'ما أطول آية في القرآن الكريم؟',['آية الدَّين','آية الكرسي','آية النور','آية الوضوء'],'سورة البقرة، الآية 282'],
['q',2,'ما أعظم آية في كتاب الله؟',['آية الكرسي','آية الدَّين','آية النور','آخر آية من البقرة'],'حديث أُبيّ بن كعب، رواه مسلم'],
['q',2,'ما السورة التي تعدل ثلث القرآن؟',['الإخلاص','الفاتحة','الكافرون','يس'],'متفق عليه'],
['q',2,'مَن المرأة الوحيدة المذكورة باسمها الصريح في القرآن؟',['مريم','آسية','هاجر','سارة'],'ذُكرت مريم عليها السلام باسمها وسُمّيت بها سورة'],
['q',2,'ما السورة التي تُسمّى أيضاً سورة «بني إسرائيل»؟',['الإسراء','البقرة','طه','القصص'],'من أسماء سورة الإسراء'],
['q',2,'كم سنة لبث أصحاب الكهف في كهفهم؟',['309 سنين','300 سنة','100 سنة','40 سنة'],'سورة الكهف، الآية 25'],
['q',2,'في أيّ سورة وردت قصّة ذي القرنين؟',['الكهف','يوسف','الأنبياء','ص'],'سورة الكهف، الآيات 83–98'],
['q',3,'مَن الصحابي الوحيد المذكور باسمه الصريح في القرآن؟',['زيد بن حارثة','أبو بكر الصدّيق','عمر بن الخطاب','علي بن أبي طالب'],'سورة الأحزاب، الآية 37'],
['q',3,'كم مرّة ورد اسم «محمد» ﷺ في القرآن الكريم؟',['4 مرّات','مرّة واحدة','7 مرّات','25 مرّة'],'آل عمران 144، الأحزاب 40، محمد 2، الفتح 29'],
['q',3,'أيّ سورة سمّاها ابن عباس «الفاضحة»؟',['التوبة','المنافقون','الأحزاب','الحشر'],'رواه البخاري ومسلم عن ابن عباس'],
['q',3,'مَن أكثر الأنبياء ذِكراً باسمه في القرآن الكريم؟',['موسى عليه السلام','إبراهيم عليه السلام','نوح عليه السلام','عيسى عليه السلام'],'ذُكر اسمه أكثر من 130 مرّة'],
['q',3,'ما السورتان اللتان سمّاهما النبي ﷺ «الزهراوين»؟',['البقرة وآل عمران','الفلق والناس','الكهف ومريم','الملك والواقعة'],'رواه مسلم عن أبي أمامة'],
['q',3,'أيّ السور التالية مدنيّة؟',['النور','يوسف','مريم','الأنعام'],'سورة النور مدنيّة، والثلاث الأخرى مكيّة'],

['q',3,'في أيّ سورة ورد قوله تعالى: ﴿صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ﴾؟',['الفاتحة','آل عمران','المائدة','البقرة'],'سورة الفاتحة، الآية 7'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَلِكُلّٖ وِجۡهَةٌ هُوَ مُوَلِّيهَاۖ فَٱسۡتَبِقُواْ ٱلۡخَيۡرَٰتِۚ أَيۡنَ مَا تَكُونُواْ يَأۡتِ بِكُمُ ٱللَّهُ جَمِيعًاۚ إِنَّ ٱللَّهَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٞ﴾؟',['البقرة','آل عمران','الأنعام','المائدة'],'سورة البقرة، الآية 148'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَإِذَا قِيلَ لَهُمۡ ءَامِنُواْ كَمَآ ءَامَنَ ٱلنَّاسُ قَالُوٓاْ أَنُؤۡمِنُ كَمَآ ءَامَنَ ٱلسُّفَهَآءُۗ أَلَآ إِنَّهُمۡ هُمُ ٱلسُّفَهَآءُ وَلَٰكِن لَّا يَعۡلَمُونَ﴾؟',['البقرة','الفاتحة','آل عمران','الأنفال'],'سورة البقرة، الآية 13'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَقَالَت طَّآئِفَةٞ مِّنۡ أَهۡلِ ٱلۡكِتَٰبِ ءَامِنُواْ بِٱلَّذِيٓ أُنزِلَ عَلَى ٱلَّذِينَ ءَامَنُواْ وَجۡهَ ٱلنَّهَارِ وَٱكۡفُرُوٓاْ ءَاخِرَهُۥ لَعَلَّهُمۡ يَرۡجِعُونَ﴾؟',['آل عمران','المائدة','الفاتحة','التوبة'],'سورة آل عمران، الآية 72'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قُلۡ يَـٰٓأَهۡلَ ٱلۡكِتَٰبِ لِمَ تَكۡفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَٱللَّهُ شَهِيدٌ عَلَىٰ مَا تَعۡمَلُونَ﴾؟',['آل عمران','الأنعام','الفاتحة','الأعراف'],'سورة آل عمران، الآية 98'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِن يَدۡعُونَ مِن دُونِهِۦٓ إِلَّآ إِنَٰثٗا وَإِن يَدۡعُونَ إِلَّا شَيۡطَٰنٗا مَّرِيدٗا﴾؟',['النساء','الأعراف','الفاتحة','الأنفال'],'سورة النساء، الآية 117'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلِكُلّٖ جَعَلۡنَا مَوَٰلِيَ مِمَّا تَرَكَ ٱلۡوَٰلِدَانِ وَٱلۡأَقۡرَبُونَۚ وَٱلَّذِينَ عَقَدَتۡ أَيۡمَٰنُكُمۡ فَـَٔاتُوهُمۡ نَصِيبَهُمۡۚ إِنَّ ٱللَّهَ كَانَ عَلَىٰ كُلِّ شَيۡءٖ شَهِيدًا﴾؟',['النساء','الأنفال','يونس','آل عمران'],'سورة النساء، الآية 33'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِنَّمَا ٱلۡخَمۡرُ وَٱلۡمَيۡسِرُ وَٱلۡأَنصَابُ وَٱلۡأَزۡلَٰمُ رِجۡسٞ مِّنۡ عَمَلِ ٱلشَّيۡطَٰنِ فَٱجۡتَنِبُوهُ لَعَلَّكُمۡ تُفۡلِحُونَ﴾؟',['المائدة','آل عمران','يونس','التوبة'],'سورة المائدة، الآية 90'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قُلۡ يَـٰٓأَهۡلَ ٱلۡكِتَٰبِ هَلۡ تَنقِمُونَ مِنَّآ إِلَّآ أَنۡ ءَامَنَّا بِٱللَّهِ وَمَآ أُنزِلَ إِلَيۡنَا وَمَآ أُنزِلَ مِن قَبۡلُ وَأَنَّ أَكۡثَرَكُمۡ فَٰسِقُونَ﴾؟',['المائدة','هود','الفاتحة','يونس'],'سورة المائدة، الآية 59'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلِكُلّٖ دَرَجَٰتٞ مِّمَّا عَمِلُواْۚ وَمَا رَبُّكَ بِغَٰفِلٍ عَمَّا يَعۡمَلُونَ﴾؟',['الأنعام','الأعراف','المائدة','التوبة'],'سورة الأنعام، الآية 132'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿ثُمَّ لَمۡ تَكُن فِتۡنَتُهُمۡ إِلَّآ أَن قَالُواْ وَٱللَّهِ رَبِّنَا مَا كُنَّا مُشۡرِكِينَ﴾؟',['الأنعام','هود','الأعراف','يوسف'],'سورة الأنعام، الآية 23'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَقَالَتۡ أُولَىٰهُمۡ لِأُخۡرَىٰهُمۡ فَمَا كَانَ لَكُمۡ عَلَيۡنَا مِن فَضۡلٖ فَذُوقُواْ ٱلۡعَذَابَ بِمَا كُنتُمۡ تَكۡسِبُونَ﴾؟',['الأعراف','يوسف','آل عمران','الرعد'],'سورة الأعراف، الآية 39'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قَالُواْ يَٰمُوسَىٰٓ إِمَّآ أَن تُلۡقِيَ وَإِمَّآ أَن نَّكُونَ نَحۡنُ ٱلۡمُلۡقِينَ﴾؟',['الأعراف','يوسف','الرعد','الأنفال'],'سورة الأعراف، الآية 115'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿كَدَأۡبِ ءَالِ فِرۡعَوۡنَ وَٱلَّذِينَ مِن قَبۡلِهِمۡۚ كَذَّبُواْ بِـَٔايَٰتِ رَبِّهِمۡ فَأَهۡلَكۡنَٰهُم بِذُنُوبِهِمۡ وَأَغۡرَقۡنَآ ءَالَ فِرۡعَوۡنَۚ وَكُلّٞ كَانُواْ ظَٰلِمِينَ﴾؟',['الأنفال','الأعراف','البقرة','المائدة'],'سورة الأنفال، الآية 54'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لِيَمِيزَ ٱللَّهُ ٱلۡخَبِيثَ مِنَ ٱلطَّيِّبِ وَيَجۡعَلَ ٱلۡخَبِيثَ بَعۡضَهُۥ عَلَىٰ بَعۡضٖ فَيَرۡكُمَهُۥ جَمِيعٗا فَيَجۡعَلَهُۥ فِي جَهَنَّمَۚ أُوْلَـٰٓئِكَ هُمُ ٱلۡخَٰسِرُونَ﴾؟',['الأنفال','يونس','البقرة','يوسف'],'سورة الأنفال، الآية 37'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَجَآءَ ٱلۡمُعَذِّرُونَ مِنَ ٱلۡأَعۡرَابِ لِيُؤۡذَنَ لَهُمۡ وَقَعَدَ ٱلَّذِينَ كَذَبُواْ ٱللَّهَ وَرَسُولَهُۥۚ سَيُصِيبُ ٱلَّذِينَ كَفَرُواْ مِنۡهُمۡ عَذَابٌ أَلِيمٞ﴾؟',['التوبة','المائدة','الحجر','يونس'],'سورة التوبة، الآية 90'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿ٱنفِرُواْ خِفَافٗا وَثِقَالٗا وَجَٰهِدُواْ بِأَمۡوَٰلِكُمۡ وَأَنفُسِكُمۡ فِي سَبِيلِ ٱللَّهِۚ ذَٰلِكُمۡ خَيۡرٞ لَّكُمۡ إِن كُنتُمۡ تَعۡلَمُونَ﴾؟',['التوبة','الأعراف','هود','آل عمران'],'سورة التوبة، الآية 41'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿دَعۡوَىٰهُمۡ فِيهَا سُبۡحَٰنَكَ ٱللَّهُمَّ وَتَحِيَّتُهُمۡ فِيهَا سَلَٰمٞۚ وَءَاخِرُ دَعۡوَىٰهُمۡ أَنِ ٱلۡحَمۡدُ لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ﴾؟',['يونس','الأنفال','المائدة','النحل'],'سورة يونس، الآية 10'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قُلۡ إِنَّ ٱلَّذِينَ يَفۡتَرُونَ عَلَى ٱللَّهِ ٱلۡكَذِبَ لَا يُفۡلِحُونَ﴾؟',['يونس','الأنعام','الرعد','النساء'],'سورة يونس، الآية 69'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قِيلَ يَٰنُوحُ ٱهۡبِطۡ بِسَلَٰمٖ مِّنَّا وَبَرَكَٰتٍ عَلَيۡكَ وَعَلَىٰٓ أُمَمٖ مِّمَّن مَّعَكَۚ وَأُمَمٞ سَنُمَتِّعُهُمۡ ثُمَّ يَمَسُّهُم مِّنَّا عَذَابٌ أَلِيمٞ﴾؟',['هود','التوبة','يوسف','الرعد'],'سورة هود، الآية 48'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قَالُوٓاْ أَتَعۡجَبِينَ مِنۡ أَمۡرِ ٱللَّهِۖ رَحۡمَتُ ٱللَّهِ وَبَرَكَٰتُهُۥ عَلَيۡكُمۡ أَهۡلَ ٱلۡبَيۡتِۚ إِنَّهُۥ حَمِيدٞ مَّجِيدٞ﴾؟',['هود','التوبة','يونس','الحجر'],'سورة هود، الآية 73'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿يُوسُفُ أَعۡرِضۡ عَنۡ هَٰذَاۚ وَٱسۡتَغۡفِرِي لِذَنۢبِكِۖ إِنَّكِ كُنتِ مِنَ ٱلۡخَاطِـِٔينَ﴾؟',['يوسف','التوبة','الحجر','ابراهيم'],'سورة يوسف، الآية 29'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿قَالَ مَعَاذَ ٱللَّهِ أَن نَّأۡخُذَ إِلَّا مَن وَجَدۡنَا مَتَٰعَنَا عِندَهُۥٓ إِنَّآ إِذٗا لَّظَٰلِمُونَ﴾؟',['يوسف','التوبة','الرعد','الأنفال'],'سورة يوسف، الآية 79'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلَقَدِ ٱسۡتُهۡزِئَ بِرُسُلٖ مِّن قَبۡلِكَ فَأَمۡلَيۡتُ لِلَّذِينَ كَفَرُواْ ثُمَّ أَخَذۡتُهُمۡۖ فَكَيۡفَ كَانَ عِقَابِ﴾؟',['الرعد','مريم','الأنفال','الكهف'],'سورة الرعد، الآية 32'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ طُوبَىٰ لَهُمۡ وَحُسۡنُ مَـَٔابٖ﴾؟',['الرعد','مريم','الإسراء','الأعراف'],'سورة الرعد، الآية 29'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَسَخَّرَ لَكُمُ ٱلشَّمۡسَ وَٱلۡقَمَرَ دَآئِبَيۡنِۖ وَسَخَّرَ لَكُمُ ٱلَّيۡلَ وَٱلنَّهَارَ﴾؟',['ابراهيم','النحل','الإسراء','الكهف'],'سورة ابراهيم، الآية 33'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَتَجَرَّعُهُۥ وَلَا يَكَادُ يُسِيغُهُۥ وَيَأۡتِيهِ ٱلۡمَوۡتُ مِن كُلِّ مَكَانٖ وَمَا هُوَ بِمَيِّتٖۖ وَمِن وَرَآئِهِۦ عَذَابٌ غَلِيظٞ﴾؟',['ابراهيم','الرعد','يونس','الحجر'],'سورة ابراهيم، الآية 17'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَقَالُوٓاْ إِنَّمَا سُكِّرَتۡ أَبۡصَٰرُنَا بَلۡ نَحۡنُ قَوۡمٞ مَّسۡحُورُونَ﴾؟',['الحجر','التوبة','الإسراء','الرعد'],'سورة الحجر، الآية 15'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَا تَمُدَّنَّ عَيۡنَيۡكَ إِلَىٰ مَا مَتَّعۡنَا بِهِۦٓ أَزۡوَٰجٗا مِّنۡهُمۡ وَلَا تَحۡزَنۡ عَلَيۡهِمۡ وَٱخۡفِضۡ جَنَاحَكَ لِلۡمُؤۡمِنِينَ﴾؟',['الحجر','الكهف','ابراهيم','الأنبياء'],'سورة الحجر، الآية 88'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلَا تَشۡتَرُواْ بِعَهۡدِ ٱللَّهِ ثَمَنٗا قَلِيلًاۚ إِنَّمَا عِندَ ٱللَّهِ هُوَ خَيۡرٞ لَّكُمۡ إِن كُنتُمۡ تَعۡلَمُونَ﴾؟',['النحل','طه','هود','ابراهيم'],'سورة النحل، الآية 95'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَإِذَا بَدَّلۡنَآ ءَايَةٗ مَّكَانَ ءَايَةٖ وَٱللَّهُ أَعۡلَمُ بِمَا يُنَزِّلُ قَالُوٓاْ إِنَّمَآ أَنتَ مُفۡتَرِۭۚ بَلۡ أَكۡثَرُهُمۡ لَا يَعۡلَمُونَ﴾؟',['النحل','الحجر','يونس','هود'],'سورة النحل، الآية 101'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَإِذَآ أَرَدۡنَآ أَن نُّهۡلِكَ قَرۡيَةً أَمَرۡنَا مُتۡرَفِيهَا فَفَسَقُواْ فِيهَا فَحَقَّ عَلَيۡهَا ٱلۡقَوۡلُ فَدَمَّرۡنَٰهَا تَدۡمِيرٗا﴾؟',['الإسراء','ابراهيم','المؤمنون','طه'],'سورة الإسراء، الآية 16'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿مَّن كَانَ يُرِيدُ ٱلۡعَاجِلَةَ عَجَّلۡنَا لَهُۥ فِيهَا مَا نَشَآءُ لِمَن نُّرِيدُ ثُمَّ جَعَلۡنَا لَهُۥ جَهَنَّمَ يَصۡلَىٰهَا مَذۡمُومٗا مَّدۡحُورٗا﴾؟',['الإسراء','الأنبياء','الرعد','النحل'],'سورة الإسراء، الآية 18'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَأُحِيطَ بِثَمَرِهِۦ فَأَصۡبَحَ يُقَلِّبُ كَفَّيۡهِ عَلَىٰ مَآ أَنفَقَ فِيهَا وَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَيَقُولُ يَٰلَيۡتَنِي لَمۡ أُشۡرِكۡ بِرَبِّيٓ أَحَدٗا﴾؟',['الكهف','الرعد','طه','الإسراء'],'سورة الكهف، الآية 42'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿۞وَتَرَكۡنَا بَعۡضَهُمۡ يَوۡمَئِذٖ يَمُوجُ فِي بَعۡضٖۖ وَنُفِخَ فِي ٱلصُّورِ فَجَمَعۡنَٰهُمۡ جَمۡعٗا﴾؟',['الكهف','يوسف','الإسراء','الحجر'],'سورة الكهف، الآية 99'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿يَـٰٓأُخۡتَ هَٰرُونَ مَا كَانَ أَبُوكِ ٱمۡرَأَ سَوۡءٖ وَمَا كَانَتۡ أُمُّكِ بَغِيّٗا﴾؟',['مريم','الرعد','طه','الفرقان'],'سورة مريم، الآية 28'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَكَمۡ أَهۡلَكۡنَا قَبۡلَهُم مِّن قَرۡنٍ هَلۡ تُحِسُّ مِنۡهُم مِّنۡ أَحَدٍ أَوۡ تَسۡمَعُ لَهُمۡ رِكۡزَۢا﴾؟',['مريم','الكهف','النحل','الحجر'],'سورة مريم، الآية 98'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَأُلۡقِيَ ٱلسَّحَرَةُ سُجَّدٗا قَالُوٓاْ ءَامَنَّا بِرَبِّ هَٰرُونَ وَمُوسَىٰ﴾؟',['طه','الإسراء','النحل','ابراهيم'],'سورة طه، الآية 70'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿نَّحۡنُ أَعۡلَمُ بِمَا يَقُولُونَ إِذۡ يَقُولُ أَمۡثَلُهُمۡ طَرِيقَةً إِن لَّبِثۡتُمۡ إِلَّا يَوۡمٗا﴾؟',['طه','الأنبياء','المؤمنون','الشعراء'],'سورة طه، الآية 104'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قَالُواْ فَأۡتُواْ بِهِۦ عَلَىٰٓ أَعۡيُنِ ٱلنَّاسِ لَعَلَّهُمۡ يَشۡهَدُونَ﴾؟',['الأنبياء','الكهف','النمل','المؤمنون'],'سورة الأنبياء، الآية 61'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلِسُلَيۡمَٰنَ ٱلرِّيحَ عَاصِفَةٗ تَجۡرِي بِأَمۡرِهِۦٓ إِلَى ٱلۡأَرۡضِ ٱلَّتِي بَٰرَكۡنَا فِيهَاۚ وَكُنَّا بِكُلِّ شَيۡءٍ عَٰلِمِينَ﴾؟',['الأنبياء','الحجر','الشعراء','الإسراء'],'سورة الأنبياء، الآية 81'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱرۡكَعُواْ وَٱسۡجُدُواْۤ وَٱعۡبُدُواْ رَبَّكُمۡ وَٱفۡعَلُواْ ٱلۡخَيۡرَ لَعَلَّكُمۡ تُفۡلِحُونَ۩﴾؟',['الحج','مريم','النمل','المؤمنون'],'سورة الحج، الآية 77'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿حُنَفَآءَ لِلَّهِ غَيۡرَ مُشۡرِكِينَ بِهِۦۚ وَمَن يُشۡرِكۡ بِٱللَّهِ فَكَأَنَّمَا خَرَّ مِنَ ٱلسَّمَآءِ فَتَخۡطَفُهُ ٱلطَّيۡرُ أَوۡ تَهۡوِي بِهِ ٱلرِّيحُ فِي مَكَانٖ سَحِيقٖ﴾؟',['الحج','الأنبياء','النمل','الكهف'],'سورة الحج، الآية 31'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قَالُواْ رَبَّنَا غَلَبَتۡ عَلَيۡنَا شِقۡوَتُنَا وَكُنَّا قَوۡمٗا ضَآلِّينَ﴾؟',['المؤمنون','النمل','العنكبوت','النور'],'سورة المؤمنون، الآية 106'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿۞وَلَوۡ رَحِمۡنَٰهُمۡ وَكَشَفۡنَا مَا بِهِم مِّن ضُرّٖ لَّلَجُّواْ فِي طُغۡيَٰنِهِمۡ يَعۡمَهُونَ﴾؟',['المؤمنون','القصص','الإسراء','الأنبياء'],'سورة المؤمنون، الآية 75'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَّقَدۡ أَنزَلۡنَآ ءَايَٰتٖ مُّبَيِّنَٰتٖۚ وَٱللَّهُ يَهۡدِي مَن يَشَآءُ إِلَىٰ صِرَٰطٖ مُّسۡتَقِيمٖ﴾؟',['النور','الحج','الروم','الأنبياء'],'سورة النور، الآية 46'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلَوۡلَا فَضۡلُ ٱللَّهِ عَلَيۡكُمۡ وَرَحۡمَتُهُۥ فِي ٱلدُّنۡيَا وَٱلۡأٓخِرَةِ لَمَسَّكُمۡ فِي مَآ أَفَضۡتُمۡ فِيهِ عَذَابٌ عَظِيمٌ﴾؟',['النور','طه','المؤمنون','الأنبياء'],'سورة النور، الآية 14'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلَقَدۡ أَتَوۡاْ عَلَى ٱلۡقَرۡيَةِ ٱلَّتِيٓ أُمۡطِرَتۡ مَطَرَ ٱلسَّوۡءِۚ أَفَلَمۡ يَكُونُواْ يَرَوۡنَهَاۚ بَلۡ كَانُواْ لَا يَرۡجُونَ نُشُورٗا﴾؟',['الفرقان','مريم','الحج','لقمان'],'سورة الفرقان، الآية 40'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبۡ لَنَا مِنۡ أَزۡوَٰجِنَا وَذُرِّيَّـٰتِنَا قُرَّةَ أَعۡيُنٖ وَٱجۡعَلۡنَا لِلۡمُتَّقِينَ إِمَامًا﴾؟',['الفرقان','الحج','النور','المؤمنون'],'سورة الفرقان، الآية 74'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قَالُواْ لَئِن لَّمۡ تَنتَهِ يَٰنُوحُ لَتَكُونَنَّ مِنَ ٱلۡمَرۡجُومِينَ﴾؟',['الشعراء','السجدة','الروم','طه'],'سورة الشعراء، الآية 116'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَكَذَّبُوهُ فَأَخَذَهُمۡ عَذَابُ يَوۡمِ ٱلظُّلَّةِۚ إِنَّهُۥ كَانَ عَذَابَ يَوۡمٍ عَظِيمٍ﴾؟',['الشعراء','الحج','الفرقان','القصص'],'سورة الشعراء، الآية 189'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قَالَ يَـٰٓأَيُّهَا ٱلۡمَلَؤُاْ أَيُّكُمۡ يَأۡتِينِي بِعَرۡشِهَا قَبۡلَ أَن يَأۡتُونِي مُسۡلِمِينَ﴾؟',['النمل','الأحزاب','لقمان','النور'],'سورة النمل، الآية 38'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَلَمَّا جَآءَ سُلَيۡمَٰنَ قَالَ أَتُمِدُّونَنِ بِمَالٖ فَمَآ ءَاتَىٰنِۦَ ٱللَّهُ خَيۡرٞ مِّمَّآ ءَاتَىٰكُمۚ بَلۡ أَنتُم بِهَدِيَّتِكُمۡ تَفۡرَحُونَ﴾؟',['النمل','العنكبوت','الأنبياء','القصص'],'سورة النمل، الآية 36'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَأَمَّا مَن تَابَ وَءَامَنَ وَعَمِلَ صَٰلِحٗا فَعَسَىٰٓ أَن يَكُونَ مِنَ ٱلۡمُفۡلِحِينَ﴾؟',['القصص','النمل','المؤمنون','الفرقان'],'سورة القصص، الآية 67'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَلَمَّا جَآءَهُم مُّوسَىٰ بِـَٔايَٰتِنَا بَيِّنَٰتٖ قَالُواْ مَا هَٰذَآ إِلَّا سِحۡرٞ مُّفۡتَرٗى وَمَا سَمِعۡنَا بِهَٰذَا فِيٓ ءَابَآئِنَا ٱلۡأَوَّلِينَ﴾؟',['القصص','الشعراء','النمل','المؤمنون'],'سورة القصص، الآية 36'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَكَذَّبُوهُ فَأَخَذَتۡهُمُ ٱلرَّجۡفَةُ فَأَصۡبَحُواْ فِي دَارِهِمۡ جَٰثِمِينَ﴾؟',['العنكبوت','الأحزاب','النمل','الفرقان'],'سورة العنكبوت، الآية 37'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَٱلَّذِينَ جَٰهَدُواْ فِينَا لَنَهۡدِيَنَّهُمۡ سُبُلَنَاۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلۡمُحۡسِنِينَ﴾؟',['العنكبوت','المؤمنون','القصص','السجدة'],'سورة العنكبوت، الآية 69'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿مَن كَفَرَ فَعَلَيۡهِ كُفۡرُهُۥۖ وَمَنۡ عَمِلَ صَٰلِحٗا فَلِأَنفُسِهِمۡ يَمۡهَدُونَ﴾؟',['الروم','سبإ','الشعراء','الأحزاب'],'سورة الروم، الآية 44'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَمِنۡ ءَايَٰتِهِۦٓ أَنۡ خَلَقَ لَكُم مِّنۡ أَنفُسِكُمۡ أَزۡوَٰجٗا لِّتَسۡكُنُوٓاْ إِلَيۡهَا وَجَعَلَ بَيۡنَكُم مَّوَدَّةٗ وَرَحۡمَةًۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يَتَفَكَّرُونَ﴾؟',['الروم','القصص','لقمان','النور'],'سورة الروم، الآية 21'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَٰبُنَيَّ أَقِمِ ٱلصَّلَوٰةَ وَأۡمُرۡ بِٱلۡمَعۡرُوفِ وَٱنۡهَ عَنِ ٱلۡمُنكَرِ وَٱصۡبِرۡ عَلَىٰ مَآ أَصَابَكَۖ إِنَّ ذَٰلِكَ مِنۡ عَزۡمِ ٱلۡأُمُورِ﴾؟',['لقمان','العنكبوت','الشعراء','فاطر'],'سورة لقمان، الآية 17'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَٰبُنَيَّ إِنَّهَآ إِن تَكُ مِثۡقَالَ حَبَّةٖ مِّنۡ خَرۡدَلٖ فَتَكُن فِي صَخۡرَةٍ أَوۡ فِي ٱلسَّمَٰوَٰتِ أَوۡ فِي ٱلۡأَرۡضِ يَأۡتِ بِهَا ٱللَّهُۚ إِنَّ ٱللَّهَ لَطِيفٌ خَبِيرٞ﴾؟',['لقمان','الأحزاب','فاطر','السجدة'],'سورة لقمان، الآية 16'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلَوۡ تَرَىٰٓ إِذِ ٱلۡمُجۡرِمُونَ نَاكِسُواْ رُءُوسِهِمۡ عِندَ رَبِّهِمۡ رَبَّنَآ أَبۡصَرۡنَا وَسَمِعۡنَا فَٱرۡجِعۡنَا نَعۡمَلۡ صَٰلِحًا إِنَّا مُوقِنُونَ﴾؟',['السجدة','يس','الصافات','لقمان'],'سورة السجدة، الآية 12'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَذُوقُواْ بِمَا نَسِيتُمۡ لِقَآءَ يَوۡمِكُمۡ هَٰذَآ إِنَّا نَسِينَٰكُمۡۖ وَذُوقُواْ عَذَابَ ٱلۡخُلۡدِ بِمَا كُنتُمۡ تَعۡمَلُونَ﴾؟',['السجدة','الروم','النمل','العنكبوت'],'سورة السجدة، الآية 14'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿تَحِيَّتُهُمۡ يَوۡمَ يَلۡقَوۡنَهُۥ سَلَٰمٞۚ وَأَعَدَّ لَهُمۡ أَجۡرٗا كَرِيمٗا﴾؟',['الأحزاب','لقمان','العنكبوت','السجدة'],'سورة الأحزاب، الآية 44'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قُل لَّن يَنفَعَكُمُ ٱلۡفِرَارُ إِن فَرَرۡتُم مِّنَ ٱلۡمَوۡتِ أَوِ ٱلۡقَتۡلِ وَإِذٗا لَّا تُمَتَّعُونَ إِلَّا قَلِيلٗا﴾؟',['الأحزاب','النمل','العنكبوت','لقمان'],'سورة الأحزاب، الآية 16'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَقَالُواْ رَبَّنَا بَٰعِدۡ بَيۡنَ أَسۡفَارِنَا وَظَلَمُوٓاْ أَنفُسَهُمۡ فَجَعَلۡنَٰهُمۡ أَحَادِيثَ وَمَزَّقۡنَٰهُمۡ كُلَّ مُمَزَّقٍۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّكُلِّ صَبَّارٖ شَكُورٖ﴾؟',['سبإ','فاطر','السجدة','الصافات'],'سورة سبإ، الآية 19'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَقَدۡ كَانَ لِسَبَإٖ فِي مَسۡكَنِهِمۡ ءَايَةٞۖ جَنَّتَانِ عَن يَمِينٖ وَشِمَالٖۖ كُلُواْ مِن رِّزۡقِ رَبِّكُمۡ وَٱشۡكُرُواْ لَهُۥۚ بَلۡدَةٞ طَيِّبَةٞ وَرَبٌّ غَفُورٞ﴾؟',['سبإ','ص','غافر','الصافات'],'سورة سبإ، الآية 15'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّ ٱلَّذِينَ يَتۡلُونَ كِتَٰبَ ٱللَّهِ وَأَقَامُواْ ٱلصَّلَوٰةَ وَأَنفَقُواْ مِمَّا رَزَقۡنَٰهُمۡ سِرّٗا وَعَلَانِيَةٗ يَرۡجُونَ تِجَٰرَةٗ لَّن تَبُورَ﴾؟',['فاطر','غافر','الزمر','السجدة'],'سورة فاطر، الآية 29'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَٱلَّذِيٓ أَوۡحَيۡنَآ إِلَيۡكَ مِنَ ٱلۡكِتَٰبِ هُوَ ٱلۡحَقُّ مُصَدِّقٗا لِّمَا بَيۡنَ يَدَيۡهِۗ إِنَّ ٱللَّهَ بِعِبَادِهِۦ لَخَبِيرُۢ بَصِيرٞ﴾؟',['فاطر','العنكبوت','يس','السجدة'],'سورة فاطر، الآية 31'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَمَا عَلَّمۡنَٰهُ ٱلشِّعۡرَ وَمَا يَنۢبَغِي لَهُۥٓۚ إِنۡ هُوَ إِلَّا ذِكۡرٞ وَقُرۡءَانٞ مُّبِينٞ﴾؟',['يس','فصلت','الأحزاب','الروم'],'سورة يس، الآية 69'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿۞أَلَمۡ أَعۡهَدۡ إِلَيۡكُمۡ يَٰبَنِيٓ ءَادَمَ أَن لَّا تَعۡبُدُواْ ٱلشَّيۡطَٰنَۖ إِنَّهُۥ لَكُمۡ عَدُوّٞ مُّبِينٞ﴾؟',['يس','ص','غافر','الصافات'],'سورة يس، الآية 60'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَٱسۡتَفۡتِهِمۡ أَهُمۡ أَشَدُّ خَلۡقًا أَم مَّنۡ خَلَقۡنَآۚ إِنَّا خَلَقۡنَٰهُم مِّن طِينٖ لَّازِبِۭ﴾؟',['الصافات','ص','الزخرف','فصلت'],'سورة الصافات، الآية 11'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿أَءِذَا مِتۡنَا وَكُنَّا تُرَابٗا وَعِظَٰمًا أَءِنَّا لَمَبۡعُوثُونَ﴾؟',['الصافات','غافر','الشورى','فاطر'],'سورة الصافات، الآية 16'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿مُتَّكِـِٔينَ فِيهَا يَدۡعُونَ فِيهَا بِفَٰكِهَةٖ كَثِيرَةٖ وَشَرَابٖ﴾؟',['ص','الأحزاب','السجدة','يس'],'سورة ص، الآية 51'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿كِتَٰبٌ أَنزَلۡنَٰهُ إِلَيۡكَ مُبَٰرَكٞ لِّيَدَّبَّرُوٓاْ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُوْلُواْ ٱلۡأَلۡبَٰبِ﴾؟',['ص','الزخرف','سبإ','الدخان'],'سورة ص، الآية 29'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قُلۡ يَٰقَوۡمِ ٱعۡمَلُواْ عَلَىٰ مَكَانَتِكُمۡ إِنِّي عَٰمِلٞۖ فَسَوۡفَ تَعۡلَمُونَ﴾؟',['الزمر','ص','الأحزاب','غافر'],'سورة الزمر، الآية 39'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَإِذَا مَسَّ ٱلۡإِنسَٰنَ ضُرّٞ دَعَانَا ثُمَّ إِذَا خَوَّلۡنَٰهُ نِعۡمَةٗ مِّنَّا قَالَ إِنَّمَآ أُوتِيتُهُۥ عَلَىٰ عِلۡمِۭۚ بَلۡ هِيَ فِتۡنَةٞ وَلَٰكِنَّ أَكۡثَرَهُمۡ لَا يَعۡلَمُونَ﴾؟',['الزمر','غافر','الجاثية','الزخرف'],'سورة الزمر، الآية 49'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَكَذَٰلِكَ حَقَّتۡ كَلِمَتُ رَبِّكَ عَلَى ٱلَّذِينَ كَفَرُوٓاْ أَنَّهُمۡ أَصۡحَٰبُ ٱلنَّارِ﴾؟',['غافر','الجاثية','ص','فصلت'],'سورة غافر، الآية 6'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَلَمَّا جَآءَتۡهُمۡ رُسُلُهُم بِٱلۡبَيِّنَٰتِ فَرِحُواْ بِمَا عِندَهُم مِّنَ ٱلۡعِلۡمِ وَحَاقَ بِهِم مَّا كَانُواْ بِهِۦ يَسۡتَهۡزِءُونَ﴾؟',['غافر','الجاثية','الشورى','الأحقاف'],'سورة غافر، الآية 83'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿سَنُرِيهِمۡ ءَايَٰتِنَا فِي ٱلۡأٓفَاقِ وَفِيٓ أَنفُسِهِمۡ حَتَّىٰ يَتَبَيَّنَ لَهُمۡ أَنَّهُ ٱلۡحَقُّۗ أَوَلَمۡ يَكۡفِ بِرَبِّكَ أَنَّهُۥ عَلَىٰ كُلِّ شَيۡءٖ شَهِيدٌ﴾؟',['فصلت','الزمر','الأحقاف','فاطر'],'سورة فصلت، الآية 53'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿حَتَّىٰٓ إِذَا مَا جَآءُوهَا شَهِدَ عَلَيۡهِمۡ سَمۡعُهُمۡ وَأَبۡصَٰرُهُمۡ وَجُلُودُهُم بِمَا كَانُواْ يَعۡمَلُونَ﴾؟',['فصلت','الأحقاف','غافر','الصافات'],'سورة فصلت، الآية 20'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَهُۥ مَقَالِيدُ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۖ يَبۡسُطُ ٱلرِّزۡقَ لِمَن يَشَآءُ وَيَقۡدِرُۚ إِنَّهُۥ بِكُلِّ شَيۡءٍ عَلِيمٞ﴾؟',['الشورى','الجاثية','الفتح','الدخان'],'سورة الشورى، الآية 12'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّمَا ٱلسَّبِيلُ عَلَى ٱلَّذِينَ يَظۡلِمُونَ ٱلنَّاسَ وَيَبۡغُونَ فِي ٱلۡأَرۡضِ بِغَيۡرِ ٱلۡحَقِّۚ أُوْلَـٰٓئِكَ لَهُمۡ عَذَابٌ أَلِيمٞ﴾؟',['الشورى','محمد','غافر','الجاثية'],'سورة الشورى، الآية 42'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿بَلۡ مَتَّعۡتُ هَـٰٓؤُلَآءِ وَءَابَآءَهُمۡ حَتَّىٰ جَآءَهُمُ ٱلۡحَقُّ وَرَسُولٞ مُّبِينٞ﴾؟',['الزخرف','غافر','ص','الزمر'],'سورة الزخرف، الآية 29'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿هَلۡ يَنظُرُونَ إِلَّا ٱلسَّاعَةَ أَن تَأۡتِيَهُم بَغۡتَةٗ وَهُمۡ لَا يَشۡعُرُونَ﴾؟',['الزخرف','ص','الجاثية','الأحقاف'],'سورة الزخرف، الآية 66'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَآ إِلَٰهَ إِلَّا هُوَ يُحۡيِۦ وَيُمِيتُۖ رَبُّكُمۡ وَرَبُّ ءَابَآئِكُمُ ٱلۡأَوَّلِينَ﴾؟',['الدخان','غافر','الشورى','ق'],'سورة الدخان، الآية 8'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿رَبِّ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ وَمَا بَيۡنَهُمَآۖ إِن كُنتُم مُّوقِنِينَ﴾؟',['الدخان','الجاثية','فصلت','غافر'],'سورة الدخان، الآية 7'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَٱخۡتِلَٰفِ ٱلَّيۡلِ وَٱلنَّهَارِ وَمَآ أَنزَلَ ٱللَّهُ مِنَ ٱلسَّمَآءِ مِن رِّزۡقٖ فَأَحۡيَا بِهِ ٱلۡأَرۡضَ بَعۡدَ مَوۡتِهَا وَتَصۡرِيفِ ٱلرِّيَٰحِ ءَايَٰتٞ لِّقَوۡمٖ يَعۡقِلُونَ﴾؟',['الجاثية','الشورى','الفتح','الحجرات'],'سورة الجاثية، الآية 5'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَتَرَىٰ كُلَّ أُمَّةٖ جَاثِيَةٗۚ كُلُّ أُمَّةٖ تُدۡعَىٰٓ إِلَىٰ كِتَٰبِهَا ٱلۡيَوۡمَ تُجۡزَوۡنَ مَا كُنتُمۡ تَعۡمَلُونَ﴾؟',['الجاثية','ق','الشورى','الفتح'],'سورة الجاثية، الآية 28'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قُلۡ مَا كُنتُ بِدۡعٗا مِّنَ ٱلرُّسُلِ وَمَآ أَدۡرِي مَا يُفۡعَلُ بِي وَلَا بِكُمۡۖ إِنۡ أَتَّبِعُ إِلَّا مَا يُوحَىٰٓ إِلَيَّ وَمَآ أَنَا۠ إِلَّا نَذِيرٞ مُّبِينٞ﴾؟',['الأحقاف','الجاثية','الطور','الدخان'],'سورة الأحقاف، الآية 9'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿مَا خَلَقۡنَا ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ وَمَا بَيۡنَهُمَآ إِلَّا بِٱلۡحَقِّ وَأَجَلٖ مُّسَمّٗىۚ وَٱلَّذِينَ كَفَرُواْ عَمَّآ أُنذِرُواْ مُعۡرِضُونَ﴾؟',['الأحقاف','الدخان','ق','محمد'],'سورة الأحقاف، الآية 3'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿ذَٰلِكَ بِأَنَّهُمۡ كَرِهُواْ مَآ أَنزَلَ ٱللَّهُ فَأَحۡبَطَ أَعۡمَٰلَهُمۡ﴾؟',['محمد','النجم','الفتح','الذاريات'],'سورة محمد، الآية 9'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿أُوْلَـٰٓئِكَ ٱلَّذِينَ لَعَنَهُمُ ٱللَّهُ فَأَصَمَّهُمۡ وَأَعۡمَىٰٓ أَبۡصَٰرَهُمۡ﴾؟',['محمد','ق','الزخرف','الفتح'],'سورة محمد، الآية 23'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿۞لَّقَدۡ رَضِيَ ٱللَّهُ عَنِ ٱلۡمُؤۡمِنِينَ إِذۡ يُبَايِعُونَكَ تَحۡتَ ٱلشَّجَرَةِ فَعَلِمَ مَا فِي قُلُوبِهِمۡ فَأَنزَلَ ٱلسَّكِينَةَ عَلَيۡهِمۡ وَأَثَٰبَهُمۡ فَتۡحٗا قَرِيبٗا﴾؟',['الفتح','الجاثية','الشورى','الذاريات'],'سورة الفتح، الآية 18'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿هُوَ ٱلَّذِيٓ أَرۡسَلَ رَسُولَهُۥ بِٱلۡهُدَىٰ وَدِينِ ٱلۡحَقِّ لِيُظۡهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦۚ وَكَفَىٰ بِٱللَّهِ شَهِيدٗا﴾؟',['الفتح','الأحقاف','القمر','محمد'],'سورة الفتح، الآية 28'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَمُنُّونَ عَلَيۡكَ أَنۡ أَسۡلَمُواْۖ قُل لَّا تَمُنُّواْ عَلَيَّ إِسۡلَٰمَكُمۖ بَلِ ٱللَّهُ يَمُنُّ عَلَيۡكُمۡ أَنۡ هَدَىٰكُمۡ لِلۡإِيمَٰنِ إِن كُنتُمۡ صَٰدِقِينَ﴾؟',['الحجرات','الفتح','النجم','الطور'],'سورة الحجرات، الآية 17'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّ ٱلَّذِينَ يُنَادُونَكَ مِن وَرَآءِ ٱلۡحُجُرَٰتِ أَكۡثَرُهُمۡ لَا يَعۡقِلُونَ﴾؟',['الحجرات','الذاريات','محمد','النجم'],'سورة الحجرات، الآية 4'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿ٱلَّذِي جَعَلَ مَعَ ٱللَّهِ إِلَٰهًا ءَاخَرَ فَأَلۡقِيَاهُ فِي ٱلۡعَذَابِ ٱلشَّدِيدِ﴾؟',['ق','الجاثية','النجم','القمر'],'سورة ق، الآية 26'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَٱلۡأَرۡضَ مَدَدۡنَٰهَا وَأَلۡقَيۡنَا فِيهَا رَوَٰسِيَ وَأَنۢبَتۡنَا فِيهَا مِن كُلِّ زَوۡجِۭ بَهِيجٖ﴾؟',['ق','الرحمن','الواقعة','الفتح'],'سورة ق، الآية 7'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿فَأَقۡبَلَتِ ٱمۡرَأَتُهُۥ فِي صَرَّةٖ فَصَكَّتۡ وَجۡهَهَا وَقَالَتۡ عَجُوزٌ عَقِيمٞ﴾؟',['الذاريات','الحجرات','الحديد','الواقعة'],'سورة الذاريات، الآية 29'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِذۡ دَخَلُواْ عَلَيۡهِ فَقَالُواْ سَلَٰمٗاۖ قَالَ سَلَٰمٞ قَوۡمٞ مُّنكَرُونَ﴾؟',['الذاريات','الفتح','الرحمن','محمد'],'سورة الذاريات، الآية 25'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَوۡمَ لَا يُغۡنِي عَنۡهُمۡ كَيۡدُهُمۡ شَيۡـٔٗا وَلَا هُمۡ يُنصَرُونَ﴾؟',['الطور','القمر','ق','الحجرات'],'سورة الطور، الآية 46'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَإِن يَرَوۡاْ كِسۡفٗا مِّنَ ٱلسَّمَآءِ سَاقِطٗا يَقُولُواْ سَحَابٞ مَّرۡكُومٞ﴾؟',['الطور','محمد','ق','الحديد'],'سورة الطور، الآية 44'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَمَا لَهُم بِهِۦ مِنۡ عِلۡمٍۖ إِن يَتَّبِعُونَ إِلَّا ٱلظَّنَّۖ وَإِنَّ ٱلظَّنَّ لَا يُغۡنِي مِنَ ٱلۡحَقِّ شَيۡـٔٗا﴾؟',['النجم','المجادلة','الرحمن','محمد'],'سورة النجم، الآية 28'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَقَوۡمَ نُوحٖ مِّن قَبۡلُۖ إِنَّهُمۡ كَانُواْ هُمۡ أَظۡلَمَ وَأَطۡغَىٰ﴾؟',['النجم','الفتح','الحجرات','المجادلة'],'سورة النجم، الآية 52'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿۞كَذَّبَتۡ قَبۡلَهُمۡ قَوۡمُ نُوحٖ فَكَذَّبُواْ عَبۡدَنَا وَقَالُواْ مَجۡنُونٞ وَٱزۡدُجِرَ﴾؟',['القمر','الحشر','الواقعة','الرحمن'],'سورة القمر، الآية 9'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّآ أَرۡسَلۡنَا عَلَيۡهِمۡ صَيۡحَةٗ وَٰحِدَةٗ فَكَانُواْ كَهَشِيمِ ٱلۡمُحۡتَظِرِ﴾؟',['القمر','الطور','الرحمن','الحجرات'],'سورة القمر، الآية 31'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿مُتَّكِـِٔينَ عَلَىٰ فُرُشِۭ بَطَآئِنُهَا مِنۡ إِسۡتَبۡرَقٖۚ وَجَنَى ٱلۡجَنَّتَيۡنِ دَانٖ﴾؟',['الرحمن','الحجرات','ق','الذاريات'],'سورة الرحمن، الآية 54'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿يَسۡـَٔلُهُۥ مَن فِي ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِۚ كُلَّ يَوۡمٍ هُوَ فِي شَأۡنٖ﴾؟',['الرحمن','الممتحنة','الصف','القمر'],'سورة الرحمن، الآية 29'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَكَانُواْ يَقُولُونَ أَئِذَا مِتۡنَا وَكُنَّا تُرَابٗا وَعِظَٰمًا أَءِنَّا لَمَبۡعُوثُونَ﴾؟',['الواقعة','ق','الذاريات','الممتحنة'],'سورة الواقعة، الآية 47'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿عَلَىٰٓ أَن نُّبَدِّلَ أَمۡثَٰلَكُمۡ وَنُنشِئَكُمۡ فِي مَا لَا تَعۡلَمُونَ﴾؟',['الواقعة','الصف','الرحمن','الطور'],'سورة الواقعة، الآية 61'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لِّئَلَّا يَعۡلَمَ أَهۡلُ ٱلۡكِتَٰبِ أَلَّا يَقۡدِرُونَ عَلَىٰ شَيۡءٖ مِّن فَضۡلِ ٱللَّهِ وَأَنَّ ٱلۡفَضۡلَ بِيَدِ ٱللَّهِ يُؤۡتِيهِ مَن يَشَآءُۚ وَٱللَّهُ ذُو ٱلۡفَضۡلِ ٱلۡعَظِيمِ﴾؟',['الحديد','المنافقون','الطور','الرحمن'],'سورة الحديد، الآية 29'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿ٱعۡلَمُوٓاْ أَنَّ ٱللَّهَ يُحۡيِ ٱلۡأَرۡضَ بَعۡدَ مَوۡتِهَاۚ قَدۡ بَيَّنَّا لَكُمُ ٱلۡأٓيَٰتِ لَعَلَّكُمۡ تَعۡقِلُونَ﴾؟',['الحديد','الصف','الجمعة','الطور'],'سورة الحديد، الآية 17'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿ٱتَّخَذُوٓاْ أَيۡمَٰنَهُمۡ جُنَّةٗ فَصَدُّواْ عَن سَبِيلِ ٱللَّهِ فَلَهُمۡ عَذَابٞ مُّهِينٞ﴾؟',['المجادلة','التغابن','الرحمن','الواقعة'],'سورة المجادلة، الآية 16'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَّن تُغۡنِيَ عَنۡهُمۡ أَمۡوَٰلُهُمۡ وَلَآ أَوۡلَٰدُهُم مِّنَ ٱللَّهِ شَيۡـًٔاۚ أُوْلَـٰٓئِكَ أَصۡحَٰبُ ٱلنَّارِۖ هُمۡ فِيهَا خَٰلِدُونَ﴾؟',['المجادلة','الطور','الحديد','الجمعة'],'سورة المجادلة، الآية 17'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلَا تَكُونُواْ كَٱلَّذِينَ نَسُواْ ٱللَّهَ فَأَنسَىٰهُمۡ أَنفُسَهُمۡۚ أُوْلَـٰٓئِكَ هُمُ ٱلۡفَٰسِقُونَ﴾؟',['الحشر','التغابن','القمر','الطلاق'],'سورة الحشر، الآية 19'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَئِنۡ أُخۡرِجُواْ لَا يَخۡرُجُونَ مَعَهُمۡ وَلَئِن قُوتِلُواْ لَا يَنصُرُونَهُمۡ وَلَئِن نَّصَرُوهُمۡ لَيُوَلُّنَّ ٱلۡأَدۡبَٰرَ ثُمَّ لَا يُنصَرُونَ﴾؟',['الحشر','الصف','الرحمن','التغابن'],'سورة الحشر، الآية 12'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِن يَثۡقَفُوكُمۡ يَكُونُواْ لَكُمۡ أَعۡدَآءٗ وَيَبۡسُطُوٓاْ إِلَيۡكُمۡ أَيۡدِيَهُمۡ وَأَلۡسِنَتَهُم بِٱلسُّوٓءِ وَوَدُّواْ لَوۡ تَكۡفُرُونَ﴾؟',['الممتحنة','الحديد','التغابن','الجمعة'],'سورة الممتحنة، الآية 2'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿لَّا يَنۡهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ لَمۡ يُقَٰتِلُوكُمۡ فِي ٱلدِّينِ وَلَمۡ يُخۡرِجُوكُم مِّن دِيَٰرِكُمۡ أَن تَبَرُّوهُمۡ وَتُقۡسِطُوٓاْ إِلَيۡهِمۡۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلۡمُقۡسِطِينَ﴾؟',['الممتحنة','الطلاق','التغابن','الجمعة'],'سورة الممتحنة، الآية 8'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّ ٱللَّهَ يُحِبُّ ٱلَّذِينَ يُقَٰتِلُونَ فِي سَبِيلِهِۦ صَفّٗا كَأَنَّهُم بُنۡيَٰنٞ مَّرۡصُوصٞ﴾؟',['الصف','الطلاق','الجمعة','الرحمن'],'سورة الصف، الآية 4'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَغۡفِرۡ لَكُمۡ ذُنُوبَكُمۡ وَيُدۡخِلۡكُمۡ جَنَّـٰتٖ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُ وَمَسَٰكِنَ طَيِّبَةٗ فِي جَنَّـٰتِ عَدۡنٖۚ ذَٰلِكَ ٱلۡفَوۡزُ ٱلۡعَظِيمُ﴾؟',['الصف','الحديد','الممتحنة','التحريم'],'سورة الصف، الآية 12'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قُلۡ يَـٰٓأَيُّهَا ٱلَّذِينَ هَادُوٓاْ إِن زَعَمۡتُمۡ أَنَّكُمۡ أَوۡلِيَآءُ لِلَّهِ مِن دُونِ ٱلنَّاسِ فَتَمَنَّوُاْ ٱلۡمَوۡتَ إِن كُنتُمۡ صَٰدِقِينَ﴾؟',['الجمعة','الطلاق','الحشر','المجادلة'],'سورة الجمعة، الآية 6'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِذَا نُودِيَ لِلصَّلَوٰةِ مِن يَوۡمِ ٱلۡجُمُعَةِ فَٱسۡعَوۡاْ إِلَىٰ ذِكۡرِ ٱللَّهِ وَذَرُواْ ٱلۡبَيۡعَۚ ذَٰلِكُمۡ خَيۡرٞ لَّكُمۡ إِن كُنتُمۡ تَعۡلَمُونَ﴾؟',['الجمعة','الحديد','المنافقون','الممتحنة'],'سورة الجمعة، الآية 9'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَقُولُونَ لَئِن رَّجَعۡنَآ إِلَى ٱلۡمَدِينَةِ لَيُخۡرِجَنَّ ٱلۡأَعَزُّ مِنۡهَا ٱلۡأَذَلَّۚ وَلِلَّهِ ٱلۡعِزَّةُ وَلِرَسُولِهِۦ وَلِلۡمُؤۡمِنِينَ وَلَٰكِنَّ ٱلۡمُنَٰفِقِينَ لَا يَعۡلَمُونَ﴾؟',['المنافقون','الحاقة','المجادلة','الطلاق'],'سورة المنافقون، الآية 8'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَلَن يُؤَخِّرَ ٱللَّهُ نَفۡسًا إِذَا جَآءَ أَجَلُهَاۚ وَٱللَّهُ خَبِيرُۢ بِمَا تَعۡمَلُونَ﴾؟',['المنافقون','الممتحنة','الطلاق','التغابن'],'سورة المنافقون، الآية 11'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿إِن تُقۡرِضُواْ ٱللَّهَ قَرۡضًا حَسَنٗا يُضَٰعِفۡهُ لَكُمۡ وَيَغۡفِرۡ لَكُمۡۚ وَٱللَّهُ شَكُورٌ حَلِيمٌ﴾؟',['التغابن','القلم','المعارج','الممتحنة'],'سورة التغابن، الآية 17'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓاْ إِنَّ مِنۡ أَزۡوَٰجِكُمۡ وَأَوۡلَٰدِكُمۡ عَدُوّٗا لَّكُمۡ فَٱحۡذَرُوهُمۡۚ وَإِن تَعۡفُواْ وَتَصۡفَحُواْ وَتَغۡفِرُواْ فَإِنَّ ٱللَّهَ غَفُورٞ رَّحِيمٌ﴾؟',['التغابن','القلم','الحاقة','الممتحنة'],'سورة التغابن، الآية 14'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَكَأَيِّن مِّن قَرۡيَةٍ عَتَتۡ عَنۡ أَمۡرِ رَبِّهَا وَرُسُلِهِۦ فَحَاسَبۡنَٰهَا حِسَابٗا شَدِيدٗا وَعَذَّبۡنَٰهَا عَذَابٗا نُّكۡرٗا﴾؟',['الطلاق','الصف','التغابن','الجمعة'],'سورة الطلاق، الآية 8'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿وَيَرۡزُقۡهُ مِنۡ حَيۡثُ لَا يَحۡتَسِبُۚ وَمَن يَتَوَكَّلۡ عَلَى ٱللَّهِ فَهُوَ حَسۡبُهُۥٓۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمۡرِهِۦۚ قَدۡ جَعَلَ ٱللَّهُ لِكُلِّ شَيۡءٖ قَدۡرٗا﴾؟',['الطلاق','الممتحنة','الحاقة','الملك'],'سورة الطلاق، الآية 3'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿قَدۡ فَرَضَ ٱللَّهُ لَكُمۡ تَحِلَّةَ أَيۡمَٰنِكُمۡۚ وَٱللَّهُ مَوۡلَىٰكُمۡۖ وَهُوَ ٱلۡعَلِيمُ ٱلۡحَكِيمُ﴾؟',['التحريم','التغابن','نوح','الطلاق'],'سورة التحريم، الآية 2'],
['q',3,'في أيّ سورة ورد قوله تعالى: ﴿عَسَىٰ رَبُّهُۥٓ إِن طَلَّقَكُنَّ أَن يُبۡدِلَهُۥٓ أَزۡوَٰجًا خَيۡرٗا مِّنكُنَّ مُسۡلِمَٰتٖ مُّؤۡمِنَٰتٖ قَٰنِتَٰتٖ تَـٰٓئِبَٰتٍ عَٰبِدَٰتٖ سَـٰٓئِحَٰتٖ ثَيِّبَٰتٖ وَأَبۡكَارٗا﴾؟',['التحريم','القلم','الجن','المعارج'],'سورة التحريم، الآية 5'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَلَقَدۡ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنۡيَا بِمَصَٰبِيحَ وَجَعَلۡنَٰهَا رُجُومٗا لِّلشَّيَٰطِينِۖ وَأَعۡتَدۡنَا لَهُمۡ عَذَابَ ٱلسَّعِيرِ﴾؟',['الملك','المنافقون','القلم','المزمل'],'سورة الملك، الآية 5'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿قُلۡ هُوَ ٱلرَّحۡمَٰنُ ءَامَنَّا بِهِۦ وَعَلَيۡهِ تَوَكَّلۡنَاۖ فَسَتَعۡلَمُونَ مَنۡ هُوَ فِي ضَلَٰلٖ مُّبِينٖ﴾؟',['الملك','التغابن','التحريم','المزمل'],'سورة الملك، الآية 29'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّا بَلَوۡنَٰهُمۡ كَمَا بَلَوۡنَآ أَصۡحَٰبَ ٱلۡجَنَّةِ إِذۡ أَقۡسَمُواْ لَيَصۡرِمُنَّهَا مُصۡبِحِينَ﴾؟',['القلم','الحاقة','المعارج','نوح'],'سورة القلم، الآية 17'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿لَّوۡلَآ أَن تَدَٰرَكَهُۥ نِعۡمَةٞ مِّن رَّبِّهِۦ لَنُبِذَ بِٱلۡعَرَآءِ وَهُوَ مَذۡمُومٞ﴾؟',['القلم','الملك','الجمعة','التحريم'],'سورة القلم، الآية 49'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿سَخَّرَهَا عَلَيۡهِمۡ سَبۡعَ لَيَالٖ وَثَمَٰنِيَةَ أَيَّامٍ حُسُومٗاۖ فَتَرَى ٱلۡقَوۡمَ فِيهَا صَرۡعَىٰ كَأَنَّهُمۡ أَعۡجَازُ نَخۡلٍ خَاوِيَةٖ﴾؟',['الحاقة','القلم','المزمل','الجن'],'سورة الحاقة، الآية 7'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَآ أَسۡلَفۡتُمۡ فِي ٱلۡأَيَّامِ ٱلۡخَالِيَةِ﴾؟',['الحاقة','المزمل','المعارج','التغابن'],'سورة الحاقة، الآية 24'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿يُبَصَّرُونَهُمۡۚ يَوَدُّ ٱلۡمُجۡرِمُ لَوۡ يَفۡتَدِي مِنۡ عَذَابِ يَوۡمِئِذِۭ بِبَنِيهِ﴾؟',['المعارج','الانسان','التغابن','القيامة'],'سورة المعارج، الآية 11'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿خَٰشِعَةً أَبۡصَٰرُهُمۡ تَرۡهَقُهُمۡ ذِلَّةٞۚ ذَٰلِكَ ٱلۡيَوۡمُ ٱلَّذِي كَانُواْ يُوعَدُونَ﴾؟',['المعارج','التحريم','القيامة','التغابن'],'سورة المعارج، الآية 44'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَقَدۡ أَضَلُّواْ كَثِيرٗاۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا ضَلَٰلٗا﴾؟',['نوح','المرسلات','القلم','الطلاق'],'سورة نوح، الآية 24'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿مِّمَّا خَطِيٓـَٰٔتِهِمۡ أُغۡرِقُواْ فَأُدۡخِلُواْ نَارٗا فَلَمۡ يَجِدُواْ لَهُم مِّن دُونِ ٱللَّهِ أَنصَارٗا﴾؟',['نوح','القلم','الانسان','الطلاق'],'سورة نوح، الآية 25'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿قُلۡ إِنۡ أَدۡرِيٓ أَقَرِيبٞ مَّا تُوعَدُونَ أَمۡ يَجۡعَلُ لَهُۥ رَبِّيٓ أَمَدًا﴾؟',['الجن','نوح','الحاقة','المعارج'],'سورة الجن، الآية 25'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿إِلَّا بَلَٰغٗا مِّنَ ٱللَّهِ وَرِسَٰلَٰتِهِۦۚ وَمَن يَعۡصِ ٱللَّهَ وَرَسُولَهُۥ فَإِنَّ لَهُۥ نَارَ جَهَنَّمَ خَٰلِدِينَ فِيهَآ أَبَدًا﴾؟',['الجن','المرسلات','المدثر','المعارج'],'سورة الجن، الآية 23'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّآ أَرۡسَلۡنَآ إِلَيۡكُمۡ رَسُولٗا شَٰهِدًا عَلَيۡكُمۡ كَمَآ أَرۡسَلۡنَآ إِلَىٰ فِرۡعَوۡنَ رَسُولٗا﴾؟',['المزمل','النازعات','القيامة','الحاقة'],'سورة المزمل، الآية 15'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿يَوۡمَ تَرۡجُفُ ٱلۡأَرۡضُ وَٱلۡجِبَالُ وَكَانَتِ ٱلۡجِبَالُ كَثِيبٗا مَّهِيلًا﴾؟',['المزمل','الحاقة','الجن','القلم'],'سورة المزمل، الآية 14'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَمَا يَذۡكُرُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُۚ هُوَ أَهۡلُ ٱلتَّقۡوَىٰ وَأَهۡلُ ٱلۡمَغۡفِرَةِ﴾؟',['المدثر','نوح','الحاقة','الجن'],'سورة المدثر، الآية 56'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّ ٱلۡأَبۡرَارَ يَشۡرَبُونَ مِن كَأۡسٖ كَانَ مِزَاجُهَا كَافُورًا﴾؟',['الانسان','عبس','الجن','النبإ'],'سورة الانسان، الآية 5'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَيُطۡعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسۡكِينٗا وَيَتِيمٗا وَأَسِيرًا﴾؟',['الانسان','الجن','التكوير','نوح'],'سورة الانسان، الآية 8'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَجَعَلۡنَا فِيهَا رَوَٰسِيَ شَٰمِخَٰتٖ وَأَسۡقَيۡنَٰكُم مَّآءٗ فُرَاتٗا﴾؟',['المرسلات','الجن','الانسان','المطففين'],'سورة المرسلات، الآية 27'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَأَنزَلۡنَا مِنَ ٱلۡمُعۡصِرَٰتِ مَآءٗ ثَجَّاجٗا﴾؟',['النبإ','القيامة','المطففين','المزمل'],'سورة النبإ، الآية 14'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّهُمۡ كَانُواْ لَا يَرۡجُونَ حِسَابٗا﴾؟',['النبإ','الانسان','المزمل','المطففين'],'سورة النبإ، الآية 27'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿كَأَنَّهُمۡ يَوۡمَ يَرَوۡنَهَا لَمۡ يَلۡبَثُوٓاْ إِلَّا عَشِيَّةً أَوۡ ضُحَىٰهَا﴾؟',['النازعات','المدثر','القيامة','التكوير'],'سورة النازعات، الآية 46'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَأَمَّا مَنۡ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفۡسَ عَنِ ٱلۡهَوَىٰ﴾؟',['النازعات','القيامة','الإنشقاق','التكوير'],'سورة النازعات، الآية 40'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿لِكُلِّ ٱمۡرِيٕٖ مِّنۡهُمۡ يَوۡمَئِذٖ شَأۡنٞ يُغۡنِيهِ﴾؟',['عبس','البروج','الانسان','النازعات'],'سورة عبس، الآية 37'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلۡعَٰلَمِينَ﴾؟',['التكوير','عبس','النازعات','الأعلى'],'سورة التكوير، الآية 29'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿يَوۡمَ لَا تَمۡلِكُ نَفۡسٞ لِّنَفۡسٖ شَيۡـٔٗاۖ وَٱلۡأَمۡرُ يَوۡمَئِذٖ لِّلَّهِ﴾؟',['الإنفطار','النبإ','البروج','الأعلى'],'سورة الإنفطار، الآية 19'],

['q',2,'في أيّ سورة ورد قوله تعالى: ﴿هَلۡ ثُوِّبَ ٱلۡكُفَّارُ مَا كَانُواْ يَفۡعَلُونَ﴾؟',['المطففين','الإنفطار','النبإ','الفجر'],'سورة المطففين، الآية 36'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿كَلَّاۖ بَلۡۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكۡسِبُونَ﴾؟',['المطففين','البروج','المرسلات','الفجر'],'سورة المطففين، الآية 14'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ وَرَآءَ ظَهۡرِهِۦ﴾؟',['الإنشقاق','النازعات','المطففين','الأعلى'],'سورة الإنشقاق، الآية 10'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿يَـٰٓأَيُّهَا ٱلۡإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدۡحٗا فَمُلَٰقِيهِ﴾؟',['الإنشقاق','التكوير','النبإ','البلد'],'سورة الإنشقاق، الآية 6'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿وَمَا نَقَمُواْ مِنۡهُمۡ إِلَّآ أَن يُؤۡمِنُواْ بِٱللَّهِ ٱلۡعَزِيزِ ٱلۡحَمِيدِ﴾؟',['البروج','النازعات','الإنفطار','الطارق'],'سورة البروج، الآية 8'],
['q',2,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ لَهُمۡ جَنَّـٰتٞ تَجۡرِي مِن تَحۡتِهَا ٱلۡأَنۡهَٰرُۚ ذَٰلِكَ ٱلۡفَوۡزُ ٱلۡكَبِيرُ﴾؟',['البروج','الإنفطار','النازعات','الأعلى'],'سورة البروج، الآية 11'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿إِلَّا مَا شَآءَ ٱللَّهُۚ إِنَّهُۥ يَعۡلَمُ ٱلۡجَهۡرَ وَمَا يَخۡفَىٰ﴾؟',['الأعلى','الإنشقاق','الشمس','الفجر'],'سورة الأعلى، الآية 7'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿أَفَلَا يَنظُرُونَ إِلَى ٱلۡإِبِلِ كَيۡفَ خُلِقَتۡ﴾؟',['الغاشية','الأعلى','الفجر','البلد'],'سورة الغاشية، الآية 17'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿وَأَمَّآ إِذَا مَا ٱبۡتَلَىٰهُ فَقَدَرَ عَلَيۡهِ رِزۡقَهُۥ فَيَقُولُ رَبِّيٓ أَهَٰنَنِ﴾؟',['الفجر','الإنشقاق','البروج','الأعلى'],'سورة الفجر، الآية 16'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿فَأَمَّا ٱلۡإِنسَٰنُ إِذَا مَا ٱبۡتَلَىٰهُ رَبُّهُۥ فَأَكۡرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّيٓ أَكۡرَمَنِ﴾؟',['الفجر','الشمس','الأعلى','التين'],'سورة الفجر، الآية 15'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿أَيَحۡسَبُ أَن لَّن يَقۡدِرَ عَلَيۡهِ أَحَدٞ﴾؟',['البلد','الإنشقاق','الفجر','الشرح'],'سورة البلد، الآية 5'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُواْ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ وَتَوَاصَوۡاْ بِٱلۡمَرۡحَمَةِ﴾؟',['البلد','الفجر','الضحى','الشمس'],'سورة البلد، الآية 17'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿فَقَالَ لَهُمۡ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقۡيَٰهَا﴾؟',['الشمس','الغاشية','الليل','العلق'],'سورة الشمس، الآية 13'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمۡدَمَ عَلَيۡهِمۡ رَبُّهُم بِذَنۢبِهِمۡ فَسَوَّىٰهَا﴾؟',['الشمس','الضحى','القدر','العلق'],'سورة الشمس، الآية 14'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعۡمَةٖ تُجۡزَىٰٓ﴾؟',['الليل','البلد','التين','الضحى'],'سورة الليل، الآية 19'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿وَمَا يُغۡنِي عَنۡهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ﴾؟',['الليل','البلد','القدر','الفجر'],'سورة الليل، الآية 11'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ فَلَهُمۡ أَجۡرٌ غَيۡرُ مَمۡنُونٖ﴾؟',['التين','الشمس','القدر','البلد'],'سورة التين، الآية 6'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿لَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ فِيٓ أَحۡسَنِ تَقۡوِيمٖ﴾؟',['التين','البلد','الشمس','العلق'],'سورة التين، الآية 4'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿كَلَّا لَئِن لَّمۡ يَنتَهِ لَنَسۡفَعَۢا بِٱلنَّاصِيَةِ﴾؟',['العلق','القدر','البلد','القارعة'],'سورة العلق، الآية 15'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿تَنَزَّلُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذۡنِ رَبِّهِم مِّن كُلِّ أَمۡرٖ﴾؟',['القدر','العلق','الزلزلة','العاديات'],'سورة القدر، الآية 4'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿وَمَآ أُمِرُوٓاْ إِلَّا لِيَعۡبُدُواْ ٱللَّهَ مُخۡلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُواْ ٱلصَّلَوٰةَ وَيُؤۡتُواْ ٱلزَّكَوٰةَۚ وَذَٰلِكَ دِينُ ٱلۡقَيِّمَةِ﴾؟',['البينة','القارعة','القدر','الزلزلة'],'سورة البينة، الآية 5'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿إِنَّ ٱلَّذِينَ كَفَرُواْ مِنۡ أَهۡلِ ٱلۡكِتَٰبِ وَٱلۡمُشۡرِكِينَ فِي نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآۚ أُوْلَـٰٓئِكَ هُمۡ شَرُّ ٱلۡبَرِيَّةِ﴾؟',['البينة','الزلزلة','الضحى','الشرح'],'سورة البينة، الآية 6'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿فَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٍ خَيۡرٗا يَرَهُۥ﴾؟',['الزلزلة','التين','الفيل','الضحى'],'سورة الزلزلة، الآية 7'],
['q',1,'في أيّ سورة ورد قوله تعالى: ﴿وَمَن يَعۡمَلۡ مِثۡقَالَ ذَرَّةٖ شَرّٗا يَرَهُۥ﴾؟',['الزلزلة','الفيل','القدر','البينة'],'سورة الزلزلة، الآية 8'],
